        </button>
      </div>
    </div>
    ${all.length ? `<div class="seg" style="margin-bottom:13px">
      ${[['all', `전체 ${all.length}`], ['diary', `🗓️ 날짜 글 ${nDiary}`], ['free', `자유 메모 ${all.length - nDiary}`]].map(([k, l]) =>
        `<button class="${filt === k ? 'on' : ''}" data-action="memo-filter" data-k="${k}">${l}</button>`).join('')}
    </div>` : ''}
    ${ms.length ? ms.map(memoCardHTML).join('') :
      all.length ? `<div class="card empty">${filt === 'diary' ? '아직 날짜를 붙인 글이 없어요<br>달력에서 날짜를 골라 그날의 글을 남겨보세요' : '자유 메모가 없어요'}</div>`
      : `<div class="card empty"><span class="big">✏️</span>아직 메모가 없어요<br>떠오르는 생각·아이디어·오늘의 일기를 자유롭게 적어보세요<br>
        <button class="btn btn-primary btn-sm" style="margin-top:10px" data-action="add-memo">＋ 첫 메모 쓰기</button></div>`}
  `;
}

/* ============================================================
   목표 뷰
   ============================================================ */
function goalCardHTML(g) {
  const p = goalProg(g);
  const dd = ddayLabel(g.type, g.period);
  const ls = linkedStats(g.id);
  const ms = g.milestones || [];
  const metric = hasMetric(g) ? g.metric : null;
  const msHTML = ms.length ? `<div class="ms-list">${ms.map(x =>
    `<button class="ms ${x.done ? 'on' : ''}" data-action="toggle-ms" data-goal="${g.id}" data-ms="${x.id}">
      <span class="msq">✓</span><span>${esc(x.title)}</span></button>`).join('')}</div>` : '';
  const metricHTML = metric ? (() => {
    const sm = metricSummary(metric);
    return `<div class="goal-metric">
      <div class="gm-line">${sm.line}</div>
      ${metric.link ? `<span class="chip accent">🔄 자동 연동</span>` :
        `<button class="btn btn-sm" data-action="log-metric" data-id="${g.id}">${metric.dir === 'up' ? '＋ 기록' : '값 수정'}</button>`}
    </div>`;
  })() : '';
  return `<div class="card goal-card ${g.done ? 'gdone' : ''}" data-action="edit-goal" data-id="${g.id}">
    <div class="goal-top">
      <div class="goal-title">${g.done ? '🏆 ' : ''}${esc(g.title)}</div>
      <span class="chip ${dd.cls} dday">${dd.txt}</span>
    </div>
    <div class="goal-pct"><div class="progress"><div style="width:${p}%"></div></div><b>${p}%</b></div>
    ${metricHTML}
    <div class="goal-meta">
      ${metric ? `<span>${metric.link ? '💰 포트폴리오 · ' + (PF_LINK_LABEL[metric.link] || '') : (metric.dir === 'down' ? '📉' : '📈') + ' 측정 목표'}${metric.unit ? ' · ' + esc(metric.unit) : ''}</span>` :
        ms.length ? `<span>📍 단계 ${ms.filter(x => x.done).length}/${ms.length}</span>` : '<span>수동 진행률</span>'}
      ${ls.total ? `<span>🔗 연결된 할 일 ${ls.done}/${ls.total}</span>` : ''}
      ${S.trackers.filter(tk => tk.goalId === g.id && !tk.archived).map(tk => {
        const last = lastTrackerEntry(tk);
        return last ? `<span>📊 ${esc(tk.name)} ${tk.type === 'number' ? fmtNum(last.v) + (tk.unit ? ' ' + esc(tk.unit) : '') : trackerDayCount(tk) + '일 기록'}</span>` : '';
      }).join('')}
      ${g.memo ? `<span>📝 ${esc(g.memo.length > 16 ? g.memo.slice(0, 16) + '…' : g.memo)}</span>` : ''}
    </div>
    ${msHTML}
  </div>`;
}
function renderGoals() {
  const type = V.goalType, key = V.goalKey[type];
  const gs = goalsFor(type, key);
  const act = gs.filter(g => !g.done), fin = gs.filter(g => g.done);
  const avg = gs.length ? Math.round(gs.reduce((a, g) => a + goalProg(g), 0) / gs.length) : 0;

  $('[data-view=goals]').innerHTML = `
    <div class="vhead"><div><h1>목표</h1><div class="sub">월 · 분기 · 연 단위로 방향을 잡아요</div></div></div>
    <div class="seg" style="margin-bottom:12px">
      ${['month', 'quarter', 'year'].map(tp =>
        `<button class="${type === tp ? 'on' : ''}" data-action="goal-type" data-type="${tp}">${TYPE_NAME[tp]}</button>`).join('')}
    </div>
    <div class="cal-head" style="margin-bottom:12px">
      <div class="cal-title">${periodLabel(type, key)}</div>
      <div class="cal-nav">
        <button class="icon-btn" data-action="goal-nav" data-d="-1">‹</button>
        ${key !== curKey(type) ? `<button class="btn btn-sm btn-ghost" data-action="goal-now">현재</button>` : ''}
        <button class="icon-btn" data-action="goal-nav" data-d="1">›</button>
      </div>
    </div>
    ${gs.length ? `<div class="card goal-sum">
      ${ringHTML(avg, 62, 6, '.8rem')}
      <div class="gs-txt"><b>${periodLabel(type, key)}</b> 목표 ${gs.length}개<br>평균 진행률 <b>${avg}%</b>${fin.length ? ` · 달성 ${fin.length}개 🏆` : ''}</div>
    </div>` : ''}
    ${act.map(goalCardHTML).join('')}
    ${fin.length ? `<div class="sec-head"><h2>🏆 달성한 목표</h2></div>${fin.map(goalCardHTML).join('')}` : ''}
    ${!gs.length ? `<div class="card empty"><span class="big">🎯</span>${periodLabel(type, key)}의 목표가 없어요<br>새 목표를 세워볼까요?<br>
      <button class="btn btn-primary btn-sm" style="margin-top:10px" data-action="fab">＋ 목표 추가</button></div>` : ''}
  `;
}

/* ============================================================
   자산(포트폴리오) 뷰 — 내 포트폴리오 첫 화면 요약
   ============================================================ */
function renderAssets() {
  const pf = computePortfolio();
  const cur = V.assetCur;
  const M = usd => pfMoney(usd, cur);
  // 좁은 칸용 축약(억/만) 표기
  const compact = usd => pfCompact(usd, cur);
  const other = cur === 'KRW' ? pfMoney(pf.totalUSD, 'USD') : pfMoney(pf.totalUSD, 'KRW');
  const signed = usd => (usd >= 0 ? '+' : '') + compact(usd);
  const staleDays = diffDays(pf.asOf, todayStr());

  // 상단 — 통화 토글 + [현재 / 기록] 서브탭
  const head = `
    <div class="vhead">
      <div><h1>자산</h1><div class="sub">${V.assetTab === 'log' ? '2021년부터 남겨온 기록' : `내 포트폴리오 · ${pf.priceDate} 종가 기준`}</div></div>
      <div class="actions">
        <div class="seg" style="width:auto">
          ${[['KRW', '₩'], ['USD', '$']].map(([k, l]) =>
            `<button class="${cur === k ? 'on' : ''}" data-action="asset-cur" data-k="${k}" style="padding:7px 13px">${l}</button>`).join('')}
        </div>
      </div>
    </div>
    <div class="seg" style="margin-bottom:14px">
      ${[['now', '현재'], ['log', '기록']].map(([k, l]) =>
        `<button class="${V.assetTab === k ? 'on' : ''}" data-action="asset-tab" data-k="${k}">${l}</button>`).join('')}
    </div>`;

  if (V.assetTab === 'log') {
    $('[data-view=assets]').innerHTML = head + assetLogHTML(pf, cur, compact, signed);
    return;
  }

  // 자산 목표(포트폴리오 연동) — 있으면 진행바, 없으면 만들기 유도
  const assetGoals = S.goals.filter(g => !g.done && g.metric && g.metric.link === 'assets')
    .sort((a, b) => periodRange(a.type, a.period).end.localeCompare(periodRange(b.type, b.period).end));
  const ag = assetGoals[0];
  let goalHTML;
  if (ag) {
    const p = goalProg(ag), tgtUSD = pfUnitToUSD(ag.metric.target, ag.metric.unit);
    const remainUSD = Math.max(0, tgtUSD - pf.totalUSD);
    goalHTML = `<div class="pf-goalbar">
      <div class="pg-head"><span>🎯 ${esc(ag.title)}</span>
        <button class="pg-edit" data-action="edit-goal" data-id="${ag.id}">${p}% ✎</button></div>
      <div class="pg-track"><div class="pg-fill" style="width:${Math.min(100, p)}%"></div></div>
      <div class="pg-sub">${p >= 100 ? '🎉 목표 달성!' : `목표 ${compact(tgtUSD)} · ${compact(remainUSD)} 남음`}</div>
    </div>`;
  } else {
    goalHTML = `<div class="pf-goalbar"><button class="pg-edit" data-action="new-asset-goal" style="text-decoration:none">🎯 자산 목표 세우기 →</button></div>`;
  }

  // 비중 — 구성 막대 + 섹터별 가로바 (막대 폭은 최대 섹터 기준 스케일)
  const maxW = pf.sectors.length ? pf.sectors[0].weight : 1;
  const stack = pf.sectors.map(s => `<span style="width:${s.weight}%;background:${s.color}" title="${esc(s.name)} ${s.weight.toFixed(1)}%"></span>`).join('');
  const bars = pf.sectors.map(s => `
    <div class="wbar-row">
      <span class="wdot" style="background:${s.color}"></span>
      <span class="wname">${esc(s.name)}</span>
      <span class="wtrack"><div style="width:${maxW > 0 ? s.weight / maxW * 100 : 0}%;background:${s.color}"></div></span>
      <span class="wpct">${s.weight.toFixed(1)}%</span>
      <span class="wval">${compact(s.value)}</span>
    </div>`).join('');

  // 보유 종목 — 평가금액·비중·손익 한눈에 + 탭하면 상세
  const price = usd => cur === 'USD'
    ? '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '₩' + Math.round(usd * pf.fx).toLocaleString('en-US');
  const holdSorters = {
    weight: (a, b) => b.value - a.value,
    plPct: (a, b) => b.plPct - a.plPct,
    yield: (a, b) => b.currentYield - a.currentYield
  };
  const holds = [...pf.holdings].sort(holdSorters[V.holdSort] || holdSorters.weight);
  const holdRows = holds.map(h => {
    const up = h.pl >= 0;
    const open = V.holdOpen === h.t;
    const pmonths = payMonthsOf(h);
    const pmLabel = pmonths.length === 12 ? '매월' : pmonths.join('·') + '월';
    return `<div class="hold-row" data-action="hold-open" data-t="${esc(h.t)}">
      <div class="h-icon" style="background:${h.color}">${esc(h.t.slice(0, 4))}</div>
      <div class="h-main">
        <div class="h-name">${esc(h.name)}</div>
        <div class="h-sub">${esc(h.t)} · ${h.sh}주${h.annualDiv > 0 ? ` · 배당 ${h.currentYield.toFixed(1)}%` : ' · 무배당'}</div>
      </div>
      <div class="h-val">
        <div class="now">${compact(h.value)}</div>
        <div class="sub">비중 ${h.weight.toFixed(1)}%</div>
      </div>
      <div class="h-wt">
        <div class="pl ${up ? 'up' : 'down'}">${(up ? '+' : '') + h.plPct.toFixed(1)}%</div>
        <div class="pl2 ${up ? 'up' : 'down'}">${signed(h.pl)}</div>
      </div>
    </div>
    ${open ? `<div class="hold-detail">
      <span><i>현재가</i><b>${price(h.price)}</b></span>
      <span><i>평단가</i><b>${price(h.avgCost)}</b></span>
      <span><i>평가금액</i><b>${compact(h.value)}</b></span>
      <span><i>투자원금</i><b>${compact(h.cost)}</b></span>
      <span><i>평가손익</i><b class="${up ? 'up' : 'down'}">${signed(h.pl)}</b></span>
      <span><i>연 배당(세전)</i><b>${h.annualDiv > 0 ? compact(h.annualDiv) : '—'}</b></span>
      <span><i>섹터</i><b>${esc(h.sec)}</b></span>
      <span><i>지급월(예상)</i><b>${h.annualDiv > 0 ? pmLabel : '—'}</b></span>
    </div>` : ''}`;
  }).join('');

  // 배당 — 월별 예상 캘린더 + 기여 TOP + 배당 목표
  const md = monthlyDividendsUSD();
  const nowM = new Date().getMonth();
  const maxMd = Math.max(...md, 0.000001);
  const tiny = usd => {
    const v = usd * (1 - pf.taxRate);   // 세후 표시
    if (cur === 'USD') return '$' + Math.round(v).toLocaleString('en-US');
    const krw = v * pf.fx;
    return krw >= 1e8 ? (Math.round(krw / 1e7) / 10) + '억' : Math.round(krw / 1e4) + '만';
  };
  const selM = V.divMonth;   // 선택된 월 — 탭하면 그 달의 종목별 배당 상세
  const divCal = md.map((v, i) => `
    <div class="dc ${i === nowM ? 'cur' : ''} ${selM === i + 1 ? 'sel' : ''}" data-action="div-month" data-m="${i + 1}">
      <b>${v > 0 ? tiny(v) : ''}</b>
      <i style="height:${Math.max(4, v / maxMd * 100)}%"></i>
      <span>${i + 1}월</span>
    </div>`).join('');
  // 선택한 달 — 어떤 종목이 얼마나 주는지 (세후 기준, 종가·환율은 스냅샷)
  const exact = usd => {   // 상세용 정밀 표기 (세후)
    const v = usd * (1 - pf.taxRate);
    if (cur === 'USD') return '$' + v.toLocaleString('en-US', { minimumFractionDigits: v < 100 ? 1 : 0, maximumFractionDigits: v < 100 ? 1 : 0 });
    return '₩' + Math.round(v * pf.fx).toLocaleString('en-US');
  };
  const gross = usd => cur === 'USD'
    ? '$' + Math.round(usd).toLocaleString('en-US')
    : '₩' + Math.round(usd * pf.fx).toLocaleString('en-US');
  let divDetail = '';
  if (selM) {
    const rows = pf.holdings
      .filter(h => h.annualDiv > 0 && payMonthsOf(h).includes(selM))
      .map(h => ({ h, usd: h.annualDiv / payMonthsOf(h).length }))
      .sort((a, b) => b.usd - a.usd);
    const tot = rows.reduce((a, r) => a + r.usd, 0);
    divDetail = `<div class="div-mdetail">
      <div class="dm-head"><b>${selM}월 예상 배당${selM === nowM + 1 ? ' (이번 달)' : ''}</b>
        ${rows.length ? `<span>세후 <b>${exact(tot)}</b> · 세전 ${gross(tot)}</span>` : ''}</div>
      ${rows.length ? rows.map(({ h, usd }) => `
        <div class="dm-row">
          <span class="dm-dot" style="background:${h.color}"></span>
          <span class="dm-name">${esc(h.name)}</span>
          <span class="dm-sub">${h.sh}주 · ${payMonthsOf(h).length === 12 ? '매월' : '연 ' + payMonthsOf(h).length + '회'}</span>
          <b class="dm-val">${exact(usd)}</b>
        </div>`).join('') : '<div class="dm-empty">이 달에는 예상 배당이 없어요</div>'}
    </div>`;
  }
  const divTop = pf.holdings.filter(h => h.annualDiv > 0).sort((a, b) => b.annualDiv - a.annualDiv).slice(0, 5);
  const maxDiv = divTop.length ? divTop[0].annualDiv : 1;
  const divTopRows = divTop.map(h => `
    <div class="wbar-row">
      <span class="wdot" style="background:${h.color}"></span>
      <span class="wname">${esc(h.name)}</span>
      <span class="wtrack"><div style="width:${h.annualDiv / maxDiv * 100}%;background:${h.color}"></div></span>
      <span class="wpct">${pf.divUSD > 0 ? Math.round(h.annualDiv / pf.divUSD * 100) : 0}%</span>
      <span class="wval">${compact(h.annualDiv)}</span>
    </div>`).join('');
  const divGoals = S.goals.filter(g => !g.done && g.metric && g.metric.link === 'dividend')
    .sort((a, b) => periodRange(a.type, a.period).end.localeCompare(periodRange(b.type, b.period).end));
  const dg = divGoals[0];
  const divGoalHTML = dg ? (() => {
    const p = goalProg(dg), tgtUSD = pfUnitToUSD(dg.metric.target, dg.metric.unit);
    return `<div class="dvgoal" data-action="edit-goal" data-id="${dg.id}">
      <div class="dg-head"><span>🎯 ${esc(dg.title)}</span><b>${p}%</b></div>
      <div class="progress" style="height:7px;margin-top:7px"><div style="width:${Math.min(100, p)}%"></div></div>
      <div class="dg-sub">${p >= 100 ? '🎉 목표 달성!' : `세전 연 ${compact(pf.divUSD)} / 목표 ${compact(tgtUSD)} · ${compact(Math.max(0, tgtUSD - pf.divUSD))} 남음`}</div>
    </div>`;
  })() : `<button class="dvgoal-new" data-action="new-div-goal">🎯 연 배당 목표 세우기 →</button>`;

  $('[data-view=assets]').innerHTML = head + `
    <div class="pf-hero">
      <div class="pf-label">총 자산 (주식 + 예수금)</div>
      <div class="pf-total">${M(pf.totalUSD)}</div>
      <div class="pf-secondary">약 ${other} · 주식 ${compact(pf.stockUSD)} + 예수금 ${compact(pf.cashUSD)}</div>
      <div class="pf-stats">
        <div class="ps"><div class="k">평가손익</div><div class="v">${pf.plUSD >= 0 ? '▲' : '▼'} ${compact(Math.abs(pf.plUSD))}</div><div class="k" style="margin-top:2px">${(pf.plPct >= 0 ? '+' : '') + pf.plPct.toFixed(1)}%</div></div>
        <div class="ps"><div class="k">투자원금</div><div class="v">${compact(pf.costUSD)}</div><div class="k" style="margin-top:2px">주식 매입 기준</div></div>
        <div class="ps"><div class="k">연 배당 (세후)</div><div class="v">${compact(pf.divAfterUSD)}</div><div class="k" style="margin-top:2px">월 ≈ ${compact(pf.divAfterUSD / 12)}</div></div>
      </div>
      ${goalHTML}
    </div>

    <div class="card">
      <div class="card-title">💵 배당 <span class="hint">세후 = 미국 15% 원천징수</span></div>
      <div class="div-hero">
        <div class="k">연 배당 (세후)</div>
        <div class="v">${M(pf.divAfterUSD)}</div>
        <div class="s">세전 ${M(pf.divUSD)} · 배당수익률 ${pf.yieldPct.toFixed(2)}% · 원가대비 ${pf.yocPct.toFixed(2)}%</div>
      </div>
      <div class="pf-div-grid" style="margin-top:12px">
        <div class="pf-div-box"><div class="k">월평균 (세후)</div><div class="v">${M(pf.divAfterUSD / 12)}</div><div class="s">자는 동안에도 쌓여요</div></div>
        <div class="pf-div-box"><div class="k">하루평균 (세후)</div><div class="v">${M(pf.divAfterUSD / 365)}</div><div class="s">매일 들어오는 셈</div></div>
      </div>
      <div class="sec-sub">월별 예상 배당 <span>세후 · 지급월은 예상 · <b>월을 탭하면 종목별 상세</b></span></div>
      <div class="div-cal">${divCal}</div>
      ${divDetail}
      <div class="sec-sub">배당 기여 TOP ${divTop.length} <span>연 배당(세전) 기준</span></div>
      <div class="wbars" style="gap:9px">${divTopRows}</div>
      ${divGoalHTML}
    </div>

    <div class="card">
      <div class="card-title">포트폴리오 비중 <span class="hint">평가금액 기준 · 섹터별</span></div>
      <div class="pf-stack">${stack}</div>
      <div class="wbars">${bars}</div>
    </div>

    <div class="card">
      <div class="card-title"><span>보유 종목 <span class="hint">${holds.length}개 · 탭하면 상세</span></span>
        <div class="hold-sort">
          ${[['weight', '비중'], ['plPct', '수익률'], ['yield', '배당']].map(([k, l]) =>
            `<button class="${V.holdSort === k ? 'on' : ''}" data-action="hold-sort" data-k="${k}">${l}</button>`).join('')}
        </div>
      </div>
      ${holdRows}
    </div>

    <div class="pf-note">
      ${staleDays >= 7 ? `<span style="color:var(--amber);font-weight:700">📅 데이터가 ${staleDays}일 지났어요 — 최신 수치로 갱신해 주세요</span><br>` : ''}
      데이터 기준 ${pf.asOf} (가격 ${pf.priceDate} 종가) · 환율 ${pf.fx.toLocaleString('en-US')}원/$<br>
      수치를 갱신하려면 코드의 <b>PF_SNAPSHOT</b>에 최신 포트폴리오 데이터를 넣어주세요.
    </div>
  `;
}

/* ============================================================
   자산 > 기록 — 과거에 얼마였고 · 뭘 갖고 있었고 · 배당은 얼마 받았나
   ============================================================ */
// 추이 그래프에 찍을 점들 — 월별 기록 + 캡처 시점 + 지금
function hxSeries(pf) {
  // 시점마다 환산 기준이 달라서(엑셀 1,270 고정 vs 그때 실제 환율) fx를 점마다 들고 다녀요
  const pts = PF_HISTORY.months.map(([ym, krw, cost]) =>
    ({ ym, krw, cost, x: hxMonthIdx(ym), fx: PF_HISTORY.fxLegacy }));
  PF_HISTORY.marks.forEach(k => pts.push({
    ym: k.ym, krw: k.krw, cost: k.pl == null ? null : k.krw - k.pl,   // pl 없으면 원금 기록 없는 시점
    x: hxMonthIdx(k.ym), fx: k.fx, mark: true, src: k.src
  }));
  const nowYM = pf.priceDate.slice(0, 7);
  pts.push({
    ym: nowYM, krw: pf.totalUSD * pf.fx, cost: (pf.costUSD + pf.cashUSD) * pf.fx,
    x: hxMonthIdx(nowYM), fx: pf.fx, mark: true, now: true, src: '지금'
  });
  return pts;
}
/* 지금까지 쌓인 배당 — 받을 때마다 더해 올라가는 누적선
   월별 내역이 있는 해(~2024)는 월마다 꺾이고, 연 합계만 아는 해(2025~)는 점으로 표시 */
const dyUpto = d => d.partial ? (+PF_SNAPSHOT.priceDate.slice(5, 7)) : 12;
function hxDivSeries() {
  const dIdx = (y, m) => (y - 2021) * 12 + (m - 1);
  const pts = [];
  let u = 0, k = 0;
  PF_HISTORY.divYears.forEach(d => {
    if (d.m) {
      d.m.forEach((v, i) => {
        u += v; k += v * d.fx;
        pts.push({ x: dIdx(d.y, i + 1), u, k, y: d.y, mo: i + 1 });
      });
    } else {
      u += d.totKrw / d.fx; k += d.totKrw;
      pts.push({ x: dIdx(d.y, dyUpto(d)), u, k, y: d.y, mo: dyUpto(d), mark: true });
    }
  });
  return pts;
}
function hxDivChartSVG(cur) {
  const pts = hxDivSeries();
  if (pts.length < 2) return '';
  const W = 320, H = 152, x0 = 8, x1 = 312, y0 = 12, y1 = 112;
  const val = p => cur === 'USD' ? p.u : p.k;
  const maxX = pts[pts.length - 1].x || 1;
  const peak = Math.max(...pts.map(val));
  const step = Math.pow(10, Math.floor(Math.log10(peak))) / 2;   // 눈금 간격 — 자릿수의 절반
  const top = Math.ceil(peak / step) * step;
  const X = x => x0 + x / maxX * (x1 - x0);
  const Y = v => y1 - v / top * (y1 - y0);
  const line = ps => ps.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(val(p)).toFixed(1)}`).join(' ');
  const lab = v => cur === 'USD'
    ? '$' + Math.round(v).toLocaleString('en-US')
    : (v >= 1e8 ? (Math.round(v / 1e6) / 100) + '억' : Math.round(v / 1e4).toLocaleString('en-US') + '만');
  const rest = pts.filter(p => p.mark);
  const grid = [top, top / 2].map(v =>
    `<line x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${x0 + 2}" y="${(Y(v) - 3).toFixed(1)}" font-size="7.5" fill="var(--faint)">${lab(v)}</text>`).join('');
  const yearMarks = [2022, 2023, 2024, 2025, 2026].map(y => {
    const gx = X((y - 2021) * 12);
    return `<line x1="${gx.toFixed(1)}" y1="${y0}" x2="${gx.toFixed(1)}" y2="${y1}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="${gx.toFixed(1)}" y="${H - 20}" font-size="8" fill="var(--faint)" text-anchor="middle">'${String(y).slice(2)}</text>`;
  }).join('');
  const dots = rest.map(p =>
    `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(val(p)).toFixed(1)}" r="3.4" fill="var(--violet)" stroke="var(--card)" stroke-width="1.6"/>`).join('');
  // 누적선은 처음부터 끝까지 한 줄 — 연 합계만 아는 구간은 점으로만 표시해요
  const area = `${line(pts)} L${X(pts[pts.length - 1].x).toFixed(1)} ${y1} L${X(pts[0].x).toFixed(1)} ${y1} Z`;
  return `<svg class="hx-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="2021년부터 지금까지 쌓인 누적 배당">
    ${grid}${yearMarks}
    <path d="${area}" fill="var(--violet)" opacity=".10"/>
    <path d="${line(pts)}" fill="none" stroke="var(--violet)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${x0}" y="${H - 5}" font-size="7.5" fill="var(--faint)">— 쌓인 배당(세후)  ●= 연 합계만 기록된 해</text>
  </svg>`;
}
// 자산 추이 SVG — 원화 기준. 총자산은 끊김 없는 한 줄, 원금은 점선(다른 선이라는 표시)
function hxChartSVG(pts) {
  const W = 320, H = 168, x0 = 8, x1 = 312, y0 = 12, y1 = 124;
  const maxX = pts[pts.length - 1].x || 1;
  const peak = Math.max(...pts.map(p => p.krw));
  const step = Math.pow(10, Math.floor(Math.log10(peak))) / 2;   // 눈금 간격 — 자릿수의 절반
  const top = Math.ceil(peak / step) * step;
  const X = x => x0 + x / maxX * (x1 - x0);
  const Y = v => y1 - v / top * (y1 - y0);
  const line = ps => ps.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.krw).toFixed(1)}`).join(' ');
  const costLine = ps => ps.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.cost).toFixed(1)}`).join(' ');
  const solid = pts.filter(p => !p.mark);                         // 엑셀에 월별로 남아 있는 구간
  const eok = v => (Math.round(v / 1e7) / 10) + '억';
  const grid = [top, top / 2].map(v =>
    `<line x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${x0 + 2}" y="${(Y(v) - 3).toFixed(1)}" font-size="7.5" fill="var(--faint)">${eok(v)}</text>`).join('');
  const yearMarks = [2022, 2023, 2024, 2025, 2026].map(y => {
    const gx = X(hxMonthIdx(y + '-01'));
    return `<line x1="${gx.toFixed(1)}" y1="${y0}" x2="${gx.toFixed(1)}" y2="${y1}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="${gx.toFixed(1)}" y="${H - 22}" font-size="8" fill="var(--faint)" text-anchor="middle">'${String(y).slice(2)}</text>`;
  }).join('');
  const dots = pts.filter(p => p.mark).map(p =>
    `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.krw).toFixed(1)}" r="3.4" fill="var(--accent)" stroke="var(--card)" stroke-width="1.6"/>`).join('');
  // 총자산선은 처음부터 끝까지 한 줄 — 월별 기록이 없는 구간은 ● 로만 표시해요
  const area = `${line(pts)} L${X(pts[pts.length - 1].x).toFixed(1)} ${y1} L${X(pts[0].x).toFixed(1)} ${y1} Z`;
  return `<svg class="hx-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="2021년 3월부터 지금까지의 자산 추이">
    ${grid}${yearMarks}
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${costLine(solid)}" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="3 2.5" opacity=".8"/>
    <path d="${line(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${x0}" y="${H - 6}" font-size="7.5" fill="var(--faint)">— 총자산  ---- 투자원금  ●= 캡처·현재</text>
  </svg>`;
}
function assetLogHTML(pf, cur, compact, signed) {
  const hx = PF_HISTORY;
  const pts = hxSeries(pf);
  const first = pts[0], last = pts[pts.length - 1];
  // 과거 기록은 원화로 남아 있어요. USD 보기일 땐 그 시점 환산율로 되돌려요.
  const fxOf = p => p.fx || hx.fxLegacy;
  const amt = (krw, fx) => cur === 'USD'
    ? '$' + Math.round(krw / fx).toLocaleString('en-US')
    : (Math.abs(krw) >= 1e8 ? `₩${(Math.round(Math.abs(krw) / 1e6) / 100).toLocaleString('en-US')}억`
      : `₩${Math.round(Math.abs(krw) / 1e4).toLocaleString('en-US')}만`);
  const sAmt = (krw, fx) => (krw >= 0 ? '+' : '-') + amt(Math.abs(krw), fx);
  const pct = (a, c) => c > 0 ? (a - c) / c * 100 : 0;

  /* ── 1. 자산 추이 ───────────────────────────── */
  const spanM = last.x - first.x;
  const heroSub = `${first.ym.replace('-', '.')} 첫 기록 ${amt(first.krw, hx.fxLegacy)} · ${Math.floor(spanM / 12)}년 ${spanM % 12}개월째`;
  // 연도별로 접어 보기 — 각 해의 마지막 기록 + 캡처 + 지금
  const timeline = [
    ['2021-12', '2021년 말'], ['2022-12', '2022년 말'], ['2023-12', '2023년 말'],
    ['2024-12', '2024년 말'], ['2025-08', '2025.08 캡처'], ['2025-12', '2025년 말']
  ].map(([ym, when]) => {
    const p = pts.find(x => x.ym === ym);
    return p ? { ...p, when } : null;
  }).filter(Boolean);
  timeline.push({ ...last, when: '지금 (' + last.ym.replace('-', '.') + ')' });
  // 시점 사이가 몇 달인지 — 성장률을 읽을 때 기준이 돼요
  const spanTxt = n => n >= 12 ? `${Math.floor(n / 12)}년${n % 12 ? ' ' + (n % 12) + '개월' : ''}` : `${n}개월`;
  let crossNote = false;   // 환산 기준이 바뀌는 줄이 있으면 표 아래에 설명을 붙여요
  // 시점마다 환산 기준이 달라서(엑셀 1,270 고정 vs 실제 환율), 보고 있는 통화로 각각 바꾼 뒤에 비교해요
  const inCur = p => cur === 'USD' ? p.krw / fxOf(p) : p.krw;
  const growTxt = (p, base) => {
    const a = inCur(base), r = a > 0 ? (inCur(p) - a) / a * 100 : 0;
    // 1,000%가 넘어가면 소수점보다 '몇 배'가 읽기 쉬워요
    return { up: r >= 0, txt: (r >= 0 ? '+' : '') + (Math.abs(r) >= 1000 ? Math.round(r) : r.toFixed(1)) + '%' };
  };
  const baseYear = timeline[0];   // 누적 성장률의 기준 = 2021년 말
  const tlRows = timeline.map((p, i) => {
    const known = p.cost != null;               // 원금을 안 남겨둔 시점은 총자산만
    let right;
    if (!i) {
      // 첫 줄은 ₩57만에서 시작해 성장률이 몇 천 %가 나와요 — 숫자로는 의미가 없어서 기준점으로만
      right = `<b style="color:var(--faint)">기준</b><i>${first.ym.replace('-', '.')} ${amt(first.krw, fxOf(first))}에서</i>`;
    } else {
      const prev = timeline[i - 1];
      const g1 = growTxt(p, prev), g2 = growTxt(p, baseYear);
      // 1,270 고정 환산 구간에서 실제 환율 구간으로 넘어가는 줄은 환율 차이가 성장률에 섞여요
      const crossed = cur !== 'USD' && (fxOf(prev) === hx.fxLegacy) !== (fxOf(p) === hx.fxLegacy);
      crossNote = crossNote || crossed;
      right = `<b class="${g1.up ? 'up' : 'down'}">${g1.txt}${crossed ? '<sup>*</sup>' : ''}</b>
        <i class="${g2.up ? 'up' : 'down'}">누적 ${g2.txt}</i>`;
    }
    return `<div class="hx-row">
      <div class="hx-when"><b>${p.when}</b><i>${i ? spanTxt(p.x - timeline[i - 1].x) + ' 만에' : '첫 기록'}</i></div>
      <div class="hx-amt"><b>${amt(p.krw, fxOf(p))}</b><i>${known ? '원금 ' + amt(p.cost, fxOf(p)) : '원금 기록 없음'}</i></div>
      <div class="hx-pl">${right}</div>
    </div>`;
  }).join('');

  /* ── 2. 실제로 받은 배당 ────────────────────── */
  // 월별 내역이 있는 해는 합산, 연 합계만 아는 해는 원화를 그해 환율로 되돌려요
  const yTot = d => d.m ? d.m.reduce((a, b) => a + b, 0) : d.totKrw / d.fx;
  const divTotUSD = hx.divYears.reduce((a, d) => a + yTot(d), 0);
  const divTotKRW = hx.divYears.reduce((a, d) => a + yTot(d) * d.fx, 0);
  const divSpan = hx.divYears[hx.divYears.length - 1].y - hx.divYears[0].y + 1;
  const dMoney = (usd, fx) => cur === 'USD'
    ? '$' + Math.round(usd).toLocaleString('en-US')
    : '₩' + Math.round(usd * fx).toLocaleString('en-US');
  const maxYear = Math.max(...hx.divYears.map(yTot));
  const yearBars = hx.divYears.map(d => {
    const t = yTot(d), prev = hx.divYears.find(x => x.y === d.y - 1);
    // 아직 안 끝난 해는 전년 대비를 보여주면 오해를 사요
    const grow = prev && !d.partial ? (t / yTot(prev) - 1) * 100 : null;
    const note = d.partial ? '진행 중'
      : grow == null ? (d.from > 1 ? d.from + '월~' : '')
      : (grow >= 0 ? '+' : '') + Math.round(grow) + '%';
    return `<div class="wbar-row hx-yb ${V.hxDivYear === d.y ? 'on' : ''}" data-action="hx-div-year" data-y="${d.y}">
      <span class="wname">${d.y}년</span>
      <span class="wtrack"><div style="width:${t / maxYear * 100}%;background:var(--accent)"></div></span>
      <span class="wpct">${dMoney(t, d.fx)}</span>
      <span class="wval">${note}</span>
    </div>`;
  }).join('');
  const dy = hx.divYears.find(d => d.y === V.hxDivYear) || hx.divYears[hx.divYears.length - 1];
  const dyTot = yTot(dy);
  // 막대 위 라벨 — 좁아서 만/천 단위로 줄여요
  const mTiny = v => {
    if (cur === 'USD') return '$' + Math.round(v);
    const krw = v * dy.fx;
    return krw >= 1e4 ? Math.round(krw / 1e4) + '만' : Math.round(krw / 1e3) + '천';
  };
  let dyDetail;
  if (dy.m) {
    const maxM = Math.max(...dy.m, 0.0001);
    const divCal = dy.m.map((v, i) => `
      <div class="dc" title="${i + 1}월">
        <b>${v > 0 ? mTiny(v) : ''}</b>
        <i style="height:${Math.max(3, v / maxM * 100)}%;${v === maxM ? 'background:var(--accent)' : ''}"></i>
        <span>${i + 1}</span>
      </div>`).join('');
    const maxTop = dy.top[0][1];
    const topRows = dy.top.map(([t, v]) => `
      <div class="wbar-row">
        <span class="wdot" style="background:${tkColor(t)}"></span>
        <span class="wname">${esc(tkName(t))}</span>
        <span class="wtrack"><div style="width:${v / maxTop * 100}%;background:${tkColor(t)}"></div></span>
        <span class="wpct">${Math.round(v / dyTot * 100)}%</span>
        <span class="wval">${dMoney(v, dy.fx)}</span>
      </div>`).join('');
    dyDetail = `
      <div class="sec-sub">${dy.y}년 월별 <span>${dMoney(dyTot, dy.fx)} · 월평균 ${dMoney(dyTot / (13 - dy.from), dy.fx)}</span></div>
      <div class="div-cal">${divCal}</div>
      <div class="sec-sub">${dy.y}년 배당 TOP ${dy.top.length} <span>그 해 가장 많이 준 종목</span></div>
      <div class="wbars" style="gap:9px">${topRows}</div>`;
  } else {
    const months = dyUpto(dy);
    dyDetail = `
      <div class="sec-sub">${dy.y}년 <span>${dy.partial ? '올해 지금까지' : '연 합계'}</span></div>
      <div class="div-hero" style="margin-bottom:0">
        <div class="k">${dy.partial ? `1월 ~ ${months}월 받은 배당` : '그 해 받은 배당'}</div>
        <div class="v">${dMoney(dyTot, dy.fx)}</div>
        <div class="s">월평균 ${dMoney(dyTot / months, dy.fx)} · 월별·종목별 내역은 남아 있지 않아 합계만 보여요</div>
      </div>`;
  }
  // '지금 예상'과 견줄 기준은 마지막으로 온전히 지나간 해
  const fullYears = hx.divYears.filter(d => !d.partial && d.from === 1);
  const lastFull = fullYears[fullYears.length - 1] || hx.divYears[0];
  const lastFullTot = yTot(lastFull);
  const nowVsThen = pf.divAfterUSD / lastFullTot;

  /* ── 3. 포트폴리오 변천사 ───────────────────── */
  // 지금 시점을 과거 스냅샷과 같은 형태로
  const nowSnap = {
    key: 'now', label: '지금', title: `${pf.priceDate} 종가 기준`,
    src: 'PF_SNAPSHOT', unit: 'USD', total: pf.stockUSD, note: `미국 주식 ${pf.holdings.length}종목`,
    holdings: pf.holdings.map(h => [h.t, h.value])
  };
  const allSnaps = [...hx.snaps, nowSnap];
  const snap = allSnaps.find(s => s.key === V.hxSnap) || allSnaps[0];
  const snapSeg = allSnaps.map(s =>
    `<button class="${snap.key === s.key ? 'on' : ''}" data-action="hx-snap" data-k="${s.key}">${esc(s.label)}</button>`).join('');
  // 비중 계산 — PCT 스냅샷은 값 자체가 %
  const sSum = snap.holdings.reduce((a, [, v]) => a + v, 0);
  const sRows = snap.holdings.map(([t, v]) => ({ t, w: v / sSum * 100, v }));
  const snapTotal = snap.unit === 'PCT'
    ? (cur === 'USD' ? '$' + Math.round(snap.total / snap.fx).toLocaleString('en-US') : '₩' + snap.total.toLocaleString('en-US'))
    : (cur === 'USD' ? '$' + Math.round(snap.total).toLocaleString('en-US')
      : '₩' + Math.round(snap.total * (snap.key === 'now' ? pf.fx : hx.fxLegacy)).toLocaleString('en-US'));
  // 종목 시트와 월별 자산 시트는 종가 시점이 달라 금액이 조금 어긋나요
  const snapFoot = snap.key === 'now' ? '<br>예수금 제외 · 주식 평가금액만'
    : snap.unit === 'USD' ? '<br>추이 그래프의 같은 시점 금액과 종가일이 달라 조금 차이 나요' : '';
  // 섹터 구성 막대
  const secMap = {};

function statsRangeOf(k) {
  const t = todayStr();
  if (k === 'week') { const w = weekDates(t); return { start: w[0], end: w[6], label: '이번 주' }; }
  if (k === 'month') { const r = periodRange('month', monthKeyOf(t)); return { ...r, label: '이번 달' }; }
  const r = periodRange('year', yearKeyOf(t)); return { ...r, label: '올해' };
}
function heatmapHTML() {
  const year = +yearKeyOf(todayStr());
  const ws = S.settings.weekStart;
  const jan1 = `${year}-01-01`, dec31 = `${year}-12-31`;
  const off = (dow(jan1) - ws + 7) % 7;
  let d = addDays(jan1, -off);
  const cols = [];
  const monthMarks = [];
  while (d <= dec31) {
    const col = [];
    let label = '';
    for (let i = 0; i < 7; i++) {
      if (d < jan1 || d > dec31) col.push('<span class="heat-cell" style="visibility:hidden"></span>');
      else if (d > todayStr()) col.push('<span class="heat-cell future"></span>');
      else {
        const st = dayStats(d);
        col.push(`<span class="heat-cell h${heatLevel(st.done)}" title="${d} · ${st.done}개 완료"></span>`);
      }
      if (d.slice(8) === '01' && d >= jan1 && d <= dec31) label = `${+d.slice(5, 7)}월`;
      d = addDays(d, 1);
    }
    monthMarks.push(label);
    cols.push(`<div class="heat-col">${col.join('')}</div>`);
  }
  const monthRow = monthMarks.map(l => `<span style="width:13px;flex:none">${l ? `<span style="position:absolute">${l}</span>` : ''}</span>`).join('');
  return `<div class="heat-wrap" id="heat-scroll">
    <div class="heat-months" style="position:relative;height:14px">${monthRow}</div>
    <div class="heatmap">${cols.join('')}</div>
  </div>
  <div class="heat-legend">적음 <span class="heat-cell"></span><span class="heat-cell h1"></span><span class="heat-cell h2"></span><span class="heat-cell h3"></span><span class="heat-cell h4"></span> 많음</div>`;
}
function barsHTML() {
  const t = todayStr();
  const thisWeekStart = weekDates(t)[0];
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const s = addDays(thisWeekStart, -7 * i);
    const st = rangeStats(s, addDays(s, 6));
    weeks.push({ s, rate: st.rate, has: st.total > 0, cur: i === 0 });
  }
  return `<div class="bars">${weeks.map(w => `
    <div class="bar ${w.cur ? 'cur' : ''}">
      <span class="bv">${w.has ? w.rate : ''}</span>
      <div class="bi" style="height:${w.has ? Math.max(4, w.rate) : 2}%"></div>
      <span class="bl">${fmtKoShort(w.s)}</span>
    </div>`).join('')}</div>`;
}

function trackerStatsCardHTML() {
  const tks = activeTrackers();
  if (!tks.length) return '';
  const t = todayStr(), from = addDays(t, -29);
  const blocks = tks.map(tk => {
    const es = trackerEntries(tk, from, t);
    if (tk.type === 'text' || es.length < 2) {
      return `<div class="tk-block" style="display:flex;align-items:center;gap:10px">
        <span style="flex:none">${esc(tk.emoji || '📊')}</span>
        <span style="flex:1;font-size:.9rem;font-weight:600">${esc(tk.name)}</span>
        <span style="font-size:.78rem;color:var(--sub)">최근 30일 ${es.length}회 · 전체 ${trackerDayCount(tk)}회</span>
      </div>`;
    }
    const vs = es.map(e => +e.v);
    const realMin = Math.min(...vs), realMax = Math.max(...vs);
    let lo = realMin, hi = realMax;
    if (tk.target != null) { lo = Math.min(lo, +tk.target); hi = Math.max(hi, +tk.target); }
    if (lo === hi) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    const W = 330, H = 74, P = 7;
    const span = Math.max(1, diffDays(es[0].d, es[es.length - 1].d));
    const x = d => P + diffDays(es[0].d, d) / span * (W - 2 * P);
    const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
    const pts = es.map(e => `${x(e.d).toFixed(1)},${y(+e.v).toFixed(1)}`).join(' ');
    const last = es[es.length - 1];
    const diff = Math.round((+last.v - +es[0].v) * 100) / 100;
    return `<div class="tk-block">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
        <span style="font-size:.9rem;font-weight:700">${esc(tk.emoji || '')} ${esc(tk.name)}</span>
        <span style="font-size:.82rem;color:var(--sub)">최근 <b style="color:var(--text)">${fmtNum(last.v)}${tk.unit ? ' ' + esc(tk.unit) : ''}</b></span>
      </div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:74px">
        ${tk.target != null ? `<line class="goal-line" x1="${P}" x2="${W - P}" y1="${y(+tk.target).toFixed(1)}" y2="${y(+tk.target).toFixed(1)}"/>` : ''}
        <polyline points="${pts}"/>
        <circle class="dot" cx="${x(last.d).toFixed(1)}" cy="${y(+last.v).toFixed(1)}" r="3.2"/>
      </svg>
      <div class="tk-stat-row">
        <span>최소 <b>${fmtNum(realMin)}</b></span><span>최대 <b>${fmtNum(realMax)}</b></span>
        <span>30일 변화 <b>${diff > 0 ? '+' : ''}${fmtNum(diff)}</b></span>
        ${tk.target != null ? `<span>🎯 목표 <b>${fmtNum(tk.target)}</b></span>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-title">📊 기록 추이 <span class="hint">최근 30일</span></div>${blocks}</div>`;
}

function subLineHTML(st = { id: uid(), title: '', done: false }) {
  return `<div class="sub-line ${st.done ? 'on' : ''}" data-sid="${st.id}" data-done="${st.done ? 1 : 0}">
    <button class="msq-btn" data-action="modal-sub-toggle" type="button">✓</button>
    <input placeholder="세부 단계" value="${esc(st.title)}" maxlength="60">
    <button class="rm" data-action="modal-sub-rm" type="button">✕</button>
  </div>`;
}
function todoModal(id, presetDate) {
  const t = id ? S.todos.find(x => x.id === id) : null;
  const d = t ? t.date : (presetDate || (V.tab === 'calendar' ? V.calSel : V.date));
  const tags = t ? [...(t.tags || [])] : [];
  openModal(`
    <div class="m-title">${t ? '할 일 수정' : '새 할 일'}</div>
    <div class="field"><input class="input" id="td-title" placeholder="무엇을 할까요?" maxlength="100" value="${t ? esc(t.title) : ''}"></div>
    <div class="frow">
      <div class="field"><label>날짜</label><input class="input" type="date" id="td-date" value="${d}"></div>
      <div class="field"><label>시간 (선택)</label><input class="input" type="time" id="td-time" value="${t && t.time ? t.time : ''}"></div>
    </div>
    <div class="field"><label>우선순위</label>
      <div class="seg" id="td-pri">${PRI.map((p, i) =>
        `<button type="button" class="${(t ? t.priority : 1) === i ? 'on' : ''}" data-pri="${i}">${p}</button>`).join('')}</div>
    </div>
    <div class="field"><label>서브태스크 체크리스트</label>
      <div class="sub-edit" id="td-subs">${(t && t.subtasks ? t.subtasks : []).map(subLineHTML).join('')}</div>
      <button class="add-line" data-action="modal-sub-add" type="button">＋ 단계 추가</button>
    </div>
    <div class="field"><label>태그</label>
      <div class="tags-box" id="td-tags"><input id="td-tag-in" placeholder="입력 후 Enter"></div>
      <div class="tag-sugs" id="td-sugs"></div>
    </div>
    <div class="field"><label>목표 연결 (선택)</label>
      <select class="input" id="td-goal">
        <option value="">연결 안 함</option>
        ${S.goals.filter(g => !g.done).map(g =>
          `<option value="${g.id}" ${t && t.goalId === g.id ? 'selected' : ''}>[${TYPE_NAME[g.type]}] ${esc(g.title)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>메모</label><textarea class="input" id="td-memo" maxlength="500" placeholder="메모 (선택)">${t ? esc(t.memo || '') : ''}</textarea></div>
    <div class="m-actions">
      ${t ? `<button class="btn btn-danger" id="td-del">삭제</button>` : ''}
      <button class="btn" data-action="close-modal">취소</button>
      <button class="btn btn-primary" id="td-save">저장</button>
    </div>
  `);
  // 우선순위 세그먼트
  let pri = t ? t.priority : 1;
  $('#td-pri').addEventListener('click', e => {
    const b = e.target.closest('[data-pri]'); if (!b) return;
    pri = +b.dataset.pri;
    $$('#td-pri button').forEach(x => x.classList.toggle('on', x === b));
  });
  // 태그 입력
  const tagBox = $('#td-tags'), tagIn = $('#td-tag-in');
  const renderTags = () => {
    tagBox.querySelectorAll('.chip').forEach(c => c.remove());
    tags.slice().reverse().forEach(tg => {
      const c = document.createElement('span');
      c.className = 'chip accent';
      c.innerHTML = `# ${esc(tg)} <button type="button">✕</button>`;
      c.querySelector('button').onclick = () => { tags.splice(tags.indexOf(tg), 1); renderTags(); };
      tagBox.prepend(c);
    });
    const sugs = allTags().filter(x => !tags.includes(x)).slice(0, 6);
    $('#td-sugs').innerHTML = sugs.map(x => `<button type="button" class="chip" data-tag="${esc(x)}"># ${esc(x)}</button>`).join('');
    $$('#td-sugs .chip').forEach(b => b.onclick = () => { tags.push(b.dataset.tag); renderTags(); });
  };
  const addTag = () => {
    const v = tagIn.value.replace(/,/g, '').trim();
    if (v && !tags.includes(v) && tags.length < 6) tags.push(v);
    tagIn.value = ''; renderTags();
  };
  tagIn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(); }
    else if (e.key === 'Backspace' && !tagIn.value && tags.length) { tags.pop(); renderTags(); }
  });
  tagIn.addEventListener('blur', addTag);
  renderTags();
  // 저장/삭제
  $('#td-save').onclick = () => {
    const title = $('#td-title').value.trim();
    if (!title) { toast('제목을 입력해주세요'); $('#td-title').focus(); return; }
    const subs = $$('#td-subs .sub-line').map(l => ({
      id: l.dataset.sid, title: l.querySelector('input').value.trim(), done: l.dataset.done === '1'
    })).filter(x => x.title);
    const data = {
      title,
      date: $('#td-date').value || todayStr(),
      time: $('#td-time').value || null,
      priority: pri, tags: [...tags], subtasks: subs,
      goalId: $('#td-goal').value || null,
      memo: $('#td-memo').value.trim()
    };
    if (t) Object.assign(t, data);
    else S.todos.push({ id: uid(), done: false, doneAt: null, createdAt: new Date().toISOString(), ...data });
    save(); closeModal(); render();
    toast(t ? '수정했어요' : '할 일을 추가했어요 ✅');
  };
  if (t) $('#td-del').onclick = async () => {
    if (await confirmDlg('할 일 삭제', `'${t.title}'을(를) 삭제할까요?`, { danger: true, ok: '삭제' })) {
      deleteWithUndo({
        keys: ['todos'], type: 'todo', data: { item: t },
        del: () => { S.todos = S.todos.filter(x => x.id !== t.id); },
        msg: '삭제했어요'
      });
    }
  };
  if (!t) setTimeout(() => $('#td-title').focus(), 250);
}
/* 할 일을 다른 날짜로 — 자주 쓰는 날짜 버튼 + 직접 고르기 */

    ['다음 주', addDays(today, 7)]
  ].filter(([, d]) => d !== t.date);
  openModal(`

    <div class="preset-chips" style="justify-content:flex-start;margin-top:0">
      ${quick.map(([l, d]) => `<button class="chip accent" data-action="move-to" data-id="${id}" data-date="${d}">${l} ${fmtKoShort(d)}</button>`).join('')}
    </div>

function routineModal(id) {
  const r = id ? S.routines.find(x => x.id === id) : null;
  const days = r ? [...r.days] : [0, 1, 2, 3, 4, 5, 6];
  openModal(`
    <div class="m-title">${r ? '루틴 수정' : '새 루틴'}</div>
    <div class="field"><input class="input" id="rt-title" placeholder="예: 아침 스트레칭, 영어 단어 20개" maxlength="60" value="${r ? esc(r.title) : ''}"></div>
    <div class="field"><label>반복 요일</label>
      <div class="day-picks" id="rt-days">${KD.map((k, i) =>
        `<button type="button" class="day-pick ${days.includes(i) ? 'on' : ''}" data-day="${i}">${k}</button>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button type="button" class="chip" id="rt-all">매일</button>
        <button type="button" class="chip" id="rt-weekday">평일만</button>
        <button type="button" class="chip" id="rt-weekend">주말만</button>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>시간 (선택)</label><input class="input" type="time" id="rt-time" value="${r && r.time ? r.time : ''}"></div>
      <div class="field"><label>시작일</label><input class="input" type="date" id="rt-start" value="${r ? (r.startDate || todayStr()) : todayStr()}"></div>
    </div>
    ${r ? `<div class="field"><label>보관</label>
      <button class="btn btn-block ${r.archived ? 'btn-primary' : 'btn-ghost'}" id="rt-arch">${r.archived ? '📦 보관됨 — 눌러서 다시 사용' : '📦 보관하기 (기록은 유지, 목록에서 숨김)'}</button></div>` : ''}
    <div class="m-actions">
      ${r ? `<button class="btn btn-danger" id="rt-del">삭제</button>` : ''}
      <button class="btn" data-action="close-modal">취소</button>
      <button class="btn btn-primary" id="rt-save">저장</button>
    </div>
  `);
  const dayBox = $('#rt-days');
  const setDays = arr => { days.length = 0; days.push(...arr); $$('#rt-days .day-pick').forEach((b, i) => b.classList.toggle('on', days.includes(i))); };
  dayBox.addEventListener('click', e => {
    const b = e.target.closest('[data-day]'); if (!b) return;
    const i = +b.dataset.day;
    days.includes(i) ? days.splice(days.indexOf(i), 1) : days.push(i);
    b.classList.toggle('on');
  });
  $('#rt-all').onclick = () => setDays([0, 1, 2, 3, 4, 5, 6]);
  $('#rt-weekday').onclick = () => setDays([1, 2, 3, 4, 5]);
  $('#rt-weekend').onclick = () => setDays([0, 6]);
  let archived = r ? !!r.archived : false;
  if (r) $('#rt-arch').onclick = function () {
    archived = !archived;
    this.className = `btn btn-block ${archived ? 'btn-primary' : 'btn-ghost'}`;
    this.textContent = archived ? '📦 보관됨 — 눌러서 다시 사용' : '📦 보관하기 (기록은 유지, 목록에서 숨김)';
  };
  $('#rt-save').onclick = () => {
    const title = $('#rt-title').value.trim();
    if (!title) { toast('루틴 이름을 입력해주세요'); return; }
    if (!days.length) { toast('요일을 하나 이상 선택해주세요'); return; }
    const data = { title, days: [...days].sort(), time: $('#rt-time').value || null, startDate: $('#rt-start').value || todayStr(), archived };
    if (r) Object.assign(r, data);
    else S.routines.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
    save(); closeModal(); render();
    toast(r ? '루틴을 수정했어요' : '루틴을 만들었어요 🔁');
  };
  if (r) $('#rt-del').onclick = async () => {
    if (await confirmDlg('루틴 삭제', `'${r.title}' 루틴과 모든 체크 기록을 삭제할까요?\n보관하면 기록은 남길 수 있어요.`, { danger: true, ok: '삭제' })) {
      const logDates = Object.keys(S.routineLog).filter(d => isRDone(r.id, d));
      deleteWithUndo({
        keys: ['routines', 'routineLog'], type: 'routine', data: { item: r, logDates },
        del: () => {
          S.routines = S.routines.filter(x => x.id !== r.id);
          for (const d in S.routineLog) {
            S.routineLog[d] = S.routineLog[d].filter(x => x !== r.id);
            if (!S.routineLog[d].length) delete S.routineLog[d];
          }
        },
        msg: '루틴을 삭제했어요'
      });
    }
  };
  if (!r) setTimeout(() => $('#rt-title').focus(), 250);
}

  if (d > todayStr()) { toast('미래 날짜는 기록할 수 없어요'); return; }
  const cur = trackerVal(tk.id, d);
  const isNum = tk.type === 'number';
  const recent = trackerEntries(tk, addDays(d, -90), d).slice(-7).reverse();
  openModal(`
    <div class="m-title">${esc(tk.emoji || '📊')} ${esc(tk.name)} <span class="chip">${fmtKoShort(d)} ${KD[dow(d)]}</span></div>
    ${isNum ? `
      <div class="field"><label>값${tk.unit ? ` (${esc(tk.unit)})` : ''}</label>
        <input class="input" type="number" step="any" inputmode="decimal" id="tk-in" placeholder="예: 72.5" value="${cur !== undefined ? fmtNum(cur) : ''}">

/* ============================================================
   애플워치·피트니스 가져오기
   ------------------------------------------------------------
   웹앱은 애플 건강(HealthKit)을 직접 읽을 수 없어요. 그래서 아이폰 '단축어' 앱이
   건강 데이터를 뽑아 텍스트로 만들어 주면, 그 텍스트를 이 앱이 읽는 방식을 씁니다.
   - 붙여넣기(권장): 단축어 → 클립보드에 복사 → 앱에서 [클립보드에서] 한 번
   - 주소로 열기: 주소 끝에 #fit=... 를 붙이면 열자마자 물어보고 가져와요 (PC·안드로이드용)
   ============================================================ */
const FIT_KEYS = {
  date: 'date', 날짜: 'date', day: 'date',
  active: 'act', activeenergy: 'act', 활동: 'act', 활동에너지: 'act', 활동칼로리: 'act', act: 'act',
  rest: 'rest', resting: 'rest', restingenergy: 'rest', 휴식: 'rest', 휴식에너지: 'rest',
  기초: 'rest', 기초대사: 'rest', 기초대사량: 'rest',
  exercise: 'ex', ex: 'ex', 운동시간: 'ex', 운동분: 'ex', exerciseminutes: 'ex',
  stand: 'stand', standhours: 'stand', 서있기: 'stand', 서기: 'stand',
  steps: 'steps', step: 'steps', 걸음: 'steps', 걸음수: 'steps',
  workout: 'wk', workouts: 'wk', 운동: 'wk'
};
const fitNum = v => {
  const m = String(v ?? '').replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
};
function parseFitDate(v) {
  const s = String(v ?? '').trim();
  if (!s) return null;
  if (/오늘|today/i.test(s)) return todayStr();
  if (/어제|yesterday/i.test(s)) return addDays(todayStr(), -1);
  const m = s.match(/(\d{4})\D{0,4}(\d{1,2})\D{0,4}(\d{1,2})/);
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : null;
}
function applyFitKey(fit, key, val) {
  if (key === 'wk') {
    const p = String(val).split(/[|｜]/).map(x => x.trim());
    if (!p[0]) return;
    const it = { n: p[0].slice(0, 30) };
    const mn = fitNum(p[1]); if (mn != null) it.min = Math.round(mn);
    const kc = fitNum(p[2]); if (kc != null) it.kcal = Math.round(kc);
    (fit.wk || (fit.wk = [])).push(it);
    return;
  }
  const n = fitNum(val);
  if (n == null || n < 0) return;
  fit[key] = key === 'stand' ? Math.round(n * 10) / 10 : Math.round(n);
}
function fitFromObject(o) {
  const rec = { date: todayStr(), fit: {} };
  Object.entries(o || {}).forEach(([k, v]) => {
    const key = FIT_KEYS[foodNorm(k)];
    if (!key) return;
    if (key === 'date') { rec.date = parseFitDate(v) || rec.date; return; }
    if (key === 'wk' && Array.isArray(v)) {
      v.forEach(w => {
        if (typeof w === 'string') { applyFitKey(rec.fit, 'wk', w); return; }
        const it = { n: String(w.n ?? w.name ?? w.type ?? '운동').slice(0, 30) };
        const mn = fitNum(w.min ?? w.minutes ?? w.duration); if (mn != null) it.min = Math.round(mn);
        const kc = fitNum(w.kcal ?? w.energy ?? w.calories); if (kc != null) it.kcal = Math.round(kc);
        (rec.fit.wk || (rec.fit.wk = [])).push(it);
      });
      return;
    }
    applyFitKey(rec.fit, key, v);
  });
  return hasFit(rec.fit) ? rec : null;
}
/* 'active=520' 같은 줄들을 읽어 날짜별 기록으로 만들어요. date= 가 나오면 새 날이 시작됩니다. */
function parseFitText(raw) {
  const txt = String(raw || '').trim();
  if (!txt) return [];
  if (/^[[{]/.test(txt)) {
    try {
      const j = JSON.parse(txt);
      return (Array.isArray(j) ? j : [j]).map(fitFromObject).filter(Boolean);
    } catch (e) { /* JSON이 아니면 아래 줄 단위 방식으로 */ }
  }
  const recs = [];
  let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    const s = line.trim();
    if (!s || /^dgrfit/i.test(s)) return;
    const m = s.match(/^([^:=]{1,24})\s*[:=]\s*(.*)$/);
    if (!m) return;
    const key = FIT_KEYS[foodNorm(m[1])];
    if (!key) return;
    if (key === 'date') { cur = { date: parseFitDate(m[2]) || todayStr(), fit: {} }; recs.push(cur); return; }
    if (!cur) { cur = { date: todayStr(), fit: {} }; recs.push(cur); }
    applyFitKey(cur.fit, key, m[2].trim());
  });
  return recs.filter(r => hasFit(r.fit));
}
// 읽어 들인 기록을 실제로 저장 — 이미 있던 값은 새 값으로 덮되, 새 값에 없는 항목은 남겨 둬요
function applyFitRecords(recs) {
  const done = [];
  (recs || []).forEach(r => {
    if (!r || !r.date || r.date > todayStr()) return;
    setLife(r.date, 'fit', { ...(lifeOf(r.date).fit || {}), ...r.fit, at: new Date().toISOString(), src: 'watch' });
    done.push(r.date);
  });
  if (done.length) save();
  return done;
}
const fitSummaryLine = f => [
  f.act ? `활동 ${fmtNum(f.act)}kcal` : '', f.rest ? `휴식 ${fmtNum(f.rest)}kcal` : '',
  f.ex ? `운동 ${fmtNum(f.ex)}분` : '', f.stand ? `서 있기 ${fmtNum(f.stand)}시간` : '',
  f.steps ? `${(+f.steps).toLocaleString()}걸음` : '',
  f.wk && f.wk.length ? `운동 ${f.wk.length}건` : ''
].filter(Boolean).join(' · ') || '내용 없음';

// 주소 끝에 #fit=... 이 붙어 열렸을 때 (단축어의 'URL 열기') — 반드시 물어보고 저장해요
async function maybeFitFromHash() {
  const m = (location.hash || '').match(/^#fit=([\s\S]*)$/);
  if (!m) return;
  let txt = m[1];
  try { txt = decodeURIComponent(txt.replace(/\+/g, ' ')); } catch (e) { /* 이미 풀린 문자열 */ }
  history.replaceState(null, '', location.pathname + location.search);   // 새로고침해도 다시 안 들어오게
  const recs = parseFitText(txt);
  if (!recs.length) { toast('가져올 활동 기록을 못 읽었어요'); return; }
  const lines = recs.slice(0, 5).map(r => `${fmtKoShort(r.date)} — ${fitSummaryLine(r.fit)}`).join('\n');
  const ok = await confirmDlg('활동 기록을 가져올까요?',
    lines + (recs.length > 5 ? `\n외 ${recs.length - 5}일` : ''), { ok: '가져오기' });
  if (!ok) return;
  const done = applyFitRecords(recs);
  render();
  toast(done.length ? `활동 기록 ${done.length}일치를 가져왔어요 ⌚` : '가져올 날짜가 없었어요');
}

    <div class="m-actions">
      <button class="btn btn-primary" id="fg-back" style="flex:1">돌아가기</button>
    </div>`);
  $('#fg-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(FIT_TEMPLATE); toast('틀을 복사했어요 📋'); }
    catch (e) { toast('이 환경에선 복사가 지원되지 않아요'); }
  };
  $('#fg-back').onclick = () => { closeModal(); if (backDate) lifeModal('fit', backDate); };
}

/* ============================================================
   모달: 라이프로그(식단·운동·독서·활동)
   ============================================================ */
const MEAL_PLACEHOLDER = { b: '예: 계란후라이 2개, 우유', l: '예: 김치찌개, 공기밥', d: '예: 닭가슴살, 샐러드', s: '예: 사과 1개 (선택)' };
let mealRefresh = null;   // 음식 등록 후 모달의 계산을 다시 돌리기 위한 고리
function lifeModal(kind, d) {
  const K = LIFE_KINDS[kind]; if (!K) return;
  if (d > todayStr()) { toast('미래 날짜는 기록할 수 없어요'); return; }
  const L = lifeOf(d);
  const dateChip = `<span class="chip">${fmtKoShort(d)} ${KD[dow(d)]}</span>`;

  /* --- 식단: 아침/점심/저녁/간식 + 칼로리 자동 계산 --- */
  if (kind === 'meal') {
    const m = L.meal || {};
    openModal(`
      <div class="m-title">🍽️ 식단 ${dateChip}</div>
      ${LIFE_MEALS.map(([k, label]) => {
        const auto = estimateKcal(m[k] || '').kcal;
        const savedK = (m.kc || {})[k];
        const manual = savedK != null && Math.round(savedK) !== auto ? '1' : '';
        return `<div class="field">
          <label>${label}</label>
          <div class="meal-line">
            <input class="input lf-meal" data-k="${k}" maxlength="120" placeholder="${MEAL_PLACEHOLDER[k]}" value="${esc(m[k] || '')}">
            <input class="input lf-kcal" data-k="${k}" data-manual="${manual}" type="number" min="0" inputmode="numeric"
              placeholder="kcal" value="${savedK ? Math.round(savedK) : ''}">
          </div>
          <div class="mk-hint" data-k="${k}"></div>
        </div>`;
      }).join('')}
      <div class="mk-total" id="mk-total"></div>
      <div style="font-size:.74rem;color:var(--faint);line-height:1.6;margin:-6px 0 14px">
        쉼표로 나눠 적으면 음식마다 칼로리를 어림해 드려요. 수량도 알아들어요 — <b>밥 2공기</b>, <b>사과 1개</b>, <b>닭가슴살 200g</b>.<br>
        kcal 칸을 직접 고치면 그 값을 그대로 써요. 음식을 다시 적으면 자동 계산으로 돌아갑니다.
      </div>
      <div class="m-actions">
        ${L.meal ? '<button class="btn btn-danger" id="lf-del">지우기</button>' : ''}
        <button class="btn btn-primary" id="lf-save" style="flex:1">저장</button>
      </div>`);

    const refresh = () => {
      let total = 0;
      LIFE_MEALS.forEach(([k]) => {
        const txt = $(`.lf-meal[data-k="${k}"]`), kin = $(`.lf-kcal[data-k="${k}"]`), hint = $(`.mk-hint[data-k="${k}"]`);
        if (!txt || !kin || !hint) return;
        const est = estimateKcal(txt.value.trim());
        if (!kin.dataset.manual) kin.value = txt.value.trim() && est.kcal ? est.kcal : '';
        const parts = est.hits.map(h => `${esc(h.n)} ${fmtNum(h.k)}${h.my ? '*' : ''}`);
        const miss = est.miss.map(x =>
          `<span class="miss">${esc(x)} ?</span><button type="button" class="mk-add" data-action="food-add" data-name="${esc(x)}">＋ 등록</button>`);
        hint.innerHTML = txt.value.trim() ? [...parts, ...miss].join(' · ') : '';
        total += (+kin.value || 0);
      });
      $('#mk-total').innerHTML = total ? `합계 ≈ ${fmtNum(total)} kcal <span>· 어림값이에요</span>` : '';
    };
    mealRefresh = refresh;
    // 음식을 다시 적으면 손으로 고친 kcal은 놓아 주고 자동 계산으로 돌아가요
    $$('.lf-meal').forEach(inp => inp.addEventListener('input', () => {
      const kin = $(`.lf-kcal[data-k="${inp.dataset.k}"]`);
      if (kin) kin.dataset.manual = '';
      refresh();
    }));
    // kcal 칸에 손을 댔다면 비워 둔 것도 뜻이 있어요 — 자동으로 다시 채우지 않아요
    $$('.lf-kcal').forEach(inp => inp.addEventListener('input', () => {
      inp.dataset.manual = '1';
      refresh();
    }));
    refresh();

    $('#lf-save').onclick = () => {
      const out = { kc: {} };
      $$('.lf-meal').forEach(inp => { const v = inp.value.trim(); if (v) out[inp.dataset.k] = v; });
      if (!LIFE_MEALS.some(([k]) => out[k])) { toast('한 끼라도 입력해주세요'); return; }
      $$('.lf-kcal').forEach(inp => {
        const k = inp.dataset.k;
        if (!out[k]) return;
        const raw = inp.value.trim();
        // 자동으로 채워진 값을 일부러 지웠다면 0으로 남겨 '계산하지 않음'을 기억해요
        if (raw === '') { if (estimateKcal(out[k]).kcal > 0) out.kc[k] = 0; return; }
        const v = parseFloat(raw);
        if (!isNaN(v) && v >= 0) out.kc[k] = Math.round(v);
      });
      if (!Object.keys(out.kc).length) delete out.kc;
      setLife(d, 'meal', out);
      mealRefresh = null;
      save(); closeModal(); render();
      const tot = mealKcal(out);
      toast(tot ? `식단을 기록했어요 🍽️ ${fmtNum(tot)} kcal` : K.done);
    };
    if (L.meal) $('#lf-del').onclick = () => {
      setLife(d, 'meal', null);
      mealRefresh = null;
      save(); closeModal(); render(); toast('기록을 지웠어요');
    };
    if (!L.meal) setTimeout(() => { const i = $('.lf-meal'); if (i) i.focus(); }, 250);
    return;
  }

  /* --- 활동: 애플워치·피트니스에서 가져오거나 직접 적기 --- */
  if (kind === 'fit') {
    const f = L.fit || {};
    const wkLine = it => `<div class="life-line">
      <input class="input" data-f="n" maxlength="30" placeholder="운동 (예: 달리기)" value="${it ? esc(it.n || '') : ''}">
      <input class="input" data-f="a" type="number" min="0" inputmode="numeric" placeholder="분" value="${it && it.min != null ? it.min : ''}">
      <input class="input" data-f="k" type="number" min="0" inputmode="numeric" placeholder="kcal" value="${it && it.kcal != null ? it.kcal : ''}">
      <button type="button" class="lf-rm" data-action="life-rm" aria-label="줄 삭제">✕</button>
    </div>`;
    const num = (id, label, val, unit) => `<div class="field"><label>${label}</label>
      <input class="input" id="${id}" type="number" min="0" inputmode="decimal" placeholder="${unit}" value="${val != null ? val : ''}"></div>`;
    openModal(`
      <div class="m-title">⌚ 활동 ${dateChip}</div>
      <div class="fit-btns">
        <button class="btn btn-primary btn-sm" id="fit-clip">📋 클립보드에서</button>
        <button class="btn btn-sm" id="fit-guide">⌚ 단축어 만드는 법</button>
      </div>
      <div class="field">
        <textarea class="input" id="fit-text" style="min-height:56px"
          placeholder="단축어가 만든 텍스트를 붙여 넣어도 돼요"></textarea>
        <button class="btn btn-sm btn-block" id="fit-apply" style="margin-top:7px">붙여 넣은 내용 읽기</button>
      </div>
      <div class="fit-grid">
        ${num('fit-act', '활동 칼로리', f.act, 'kcal')}
        ${num('fit-rest', '휴식 칼로리', f.rest, 'kcal')}
        ${num('fit-ex', '운동 시간', f.ex, '분')}
        ${num('fit-stand', '서 있기', f.stand, '시간')}
      </div>
      ${num('fit-steps', '걸음 수', f.steps, '걸음')}
      <div class="field"><label>오늘 한 운동</label>
        <div id="fit-rows">${((f.wk && f.wk.length ? f.wk : [null])).map(wkLine).join('')}</div>
        <button type="button" class="btn btn-sm" id="fit-add" style="margin-top:2px">＋ 운동 추가</button>
        <button type="button" class="btn btn-sm btn-block" id="fit-tow" style="margin-top:7px">💪 운동 기록에도 옮겨 담기</button>
      </div>
      <div style="font-size:.74rem;color:var(--faint);line-height:1.6;margin:-4px 0 14px">
        애플 건강(HealthKit)은 웹앱이 직접 읽을 수 없어서, 아이폰 <b>단축어</b>가 만든 텍스트를 받아 오는 방식이에요.
        ${f.at ? `<br>마지막으로 가져온 시각 — ${esc(memoTimeLabel(f.at))}` : ''}
      </div>
      <div class="m-actions">
        ${hasFit(f) ? '<button class="btn btn-danger" id="lf-del">지우기</button>' : ''}
        <button class="btn btn-primary" id="lf-save" style="flex:1">저장</button>
      </div>`);

    const readForm = () => {
      const g = id => { const v = parseFloat(($('#' + id) || {}).value); return isNaN(v) || v < 0 ? null : v; };
      const out = {};
      const map = { act: 'fit-act', rest: 'fit-rest', ex: 'fit-ex', stand: 'fit-stand', steps: 'fit-steps' };
      Object.entries(map).forEach(([k, id]) => {
        const v = g(id);
        if (v != null) out[k] = k === 'stand' ? Math.round(v * 10) / 10 : Math.round(v);
      });
      const wk = [];
      $$('#fit-rows .life-line').forEach(row => {
        const gv = ff => { const i = row.querySelector(`[data-f="${ff}"]`); return i ? i.value.trim() : ''; };
        const n = gv('n'); if (!n) return;
        const it = { n };
        const mn = parseFloat(gv('a')); if (!isNaN(mn) && mn > 0) it.min = Math.round(mn);
        const kc = parseFloat(gv('k')); if (!isNaN(kc) && kc > 0) it.kcal = Math.round(kc);
        wk.push(it);
      });
      if (wk.length) out.wk = wk;
      return out;
    };
    const fillForm = fit => {
      [['fit-act', 'act'], ['fit-rest', 'rest'], ['fit-ex', 'ex'], ['fit-stand', 'stand'], ['fit-steps', 'steps']]
        .forEach(([id, k]) => { if (fit[k] != null) $('#' + id).value = fit[k]; });
      if (fit.wk && fit.wk.length) $('#fit-rows').innerHTML = fit.wk.map(wkLine).join('');
    };
    const readText = txt => {
      const recs = parseFitText(txt);
      if (!recs.length) { toast('읽을 수 있는 내용이 없어요 — 단축어 만드는 법을 확인해 주세요'); return; }
      const mine = recs.find(r => r.date === d);
      const others = recs.filter(r => r.date !== d && r.date <= todayStr());
      if (mine) fillForm(mine.fit);
      const saved = others.length ? applyFitRecords(others) : [];
      if (!mine && !saved.length) { toast('이 날짜의 기록을 찾지 못했어요'); return; }
      toast(mine
        ? `가져왔어요 ⌚ ${fitSummaryLine(mine.fit)}${saved.length ? ` (+ 다른 날 ${saved.length}일)` : ''}`
        : `다른 날짜 ${saved.length}일치를 저장했어요 ⌚`);
    };

    $('#fit-clip').onclick = async () => {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        toast('이 환경에선 아래 칸에 직접 붙여 넣어 주세요'); $('#fit-text').focus(); return;
      }
      try {
        const txt = await navigator.clipboard.readText();
        if (!txt || !txt.trim()) { toast('클립보드가 비어 있어요'); return; }
        $('#fit-text').value = txt;
        readText(txt);
      } catch (e) { toast('클립보드를 못 읽었어요 — 아래 칸에 직접 붙여 넣어 주세요'); $('#fit-text').focus(); }
    };
    $('#fit-apply').onclick = () => readText($('#fit-text').value);
    $('#fit-guide').onclick = () => { closeModal(); fitGuideModal(d); };
    $('#fit-add').onclick = () => {
      const box = $('#fit-rows');
      box.insertAdjacentHTML('beforeend', wkLine(null));
      box.lastElementChild.querySelector('input').focus();
    };
    $('#fit-tow').onclick = () => {
      const wk = (readForm().wk || []);
      if (!wk.length) { toast('옮길 운동이 없어요'); return; }
      const cur = lifeOf(d).workout || [];
      const add = wk.filter(x => !cur.some(c => c.n === x.n))
        .map(x => ({ n: x.n, a: x.min ? x.min + '분' : '', ...(x.kcal ? { k: x.kcal } : {}) }));
      if (!add.length) { toast('이미 운동 기록에 들어 있어요'); return; }
      setLife(d, 'workout', [...cur, ...add]);
      save(); toast(`운동 기록에 ${add.length}개를 담았어요 💪`);
    };
    $('#lf-save').onclick = () => {
      const out = readForm();
      if (!hasFit(out)) { toast('숫자를 하나라도 채워주세요'); return; }
      setLife(d, 'fit', { ...out, at: new Date().toISOString(), src: (L.fit && L.fit.src) || 'manual' });
      save(); closeModal(); render(); toast(K.done);
    };
    if (hasFit(f)) $('#lf-del').onclick = () => {
      setLife(d, 'fit', null);
      save(); closeModal(); render(); toast('기록을 지웠어요');
    };
    return;
  }

  /* --- 운동/독서: 여러 항목 리스트 --- */
  const isW = kind === 'workout';
  const skey = isW ? 'workout' : 'read';
  const items = L[skey] || [];
  const line = it => isW ? `
    <div class="life-line">
      <input class="input" data-f="n" maxlength="30" placeholder="운동 (예: 러닝)" value="${it ? esc(it.n || '') : ''}">
      <input class="input" data-f="a" maxlength="20" placeholder="얼마나 (예: 30분)" value="${it ? esc(it.a || '') : ''}">
      <input class="input" data-f="k" type="number" min="0" inputmode="numeric" placeholder="kcal" value="${it && it.k != null ? it.k : ''}">
      <button type="button" class="lf-rm" data-action="life-rm" aria-label="줄 삭제">✕</button>
    </div>` : `
    <div class="life-line">
      <input class="input" data-f="b" maxlength="40" placeholder="책 제목 (예: 어린왕자)" value="${it ? esc(it.b || '') : ''}">
      <input class="input" data-f="a" maxlength="20" placeholder="분량 (예: 40~80쪽)" value="${it ? esc(it.a || '') : ''}">
      <button type="button" class="lf-rm" data-action="life-rm" aria-label="줄 삭제">✕</button>
    </div>`;
  openModal(`
    <div class="m-title">${K.emoji} ${K.name} ${dateChip}</div>
    <div class="field"><label>${isW ? '오늘 한 운동' : '오늘 읽은 책'}</label>
      <div id="lf-rows">${(items.length ? items : [null]).map(line).join('')}</div>
      <button type="button" class="btn btn-sm" id="lf-add" style="margin-top:2px">＋ ${isW ? '운동' : '책'} 추가</button>
    </div>
    ${isW ? '<div style="font-size:.76rem;color:var(--sub);margin:-6px 0 12px">🔥 소모 칼로리(kcal)를 적으면 합계가 자동으로 표시돼요</div>' : ''}
    <div class="m-actions">
      ${items.length ? '<button class="btn btn-danger" id="lf-del">지우기</button>' : ''}
      <button class="btn btn-primary" id="lf-save" style="flex:1">저장</button>
    </div>`);
  $('#lf-add').onclick = () => {
    const box = $('#lf-rows');
    box.insertAdjacentHTML('beforeend', line(null));
    box.lastElementChild.querySelector('input').focus();
  };
  $('#lf-save').onclick = () => {
    const out = [];
    $$('#lf-rows .life-line').forEach(row => {
      const get = f => { const i = row.querySelector(`[data-f="${f}"]`); return i ? i.value.trim() : ''; };
      if (isW) {
        const n = get('n'); if (!n) return;
        const k = parseFloat(get('k'));
        const it = { n, a: get('a') };
        if (!isNaN(k) && k > 0) it.k = Math.round(k);
        out.push(it);
      } else {
        const b = get('b'); if (!b) return;
        out.push({ b, a: get('a') });
      }
    });
    if (!out.length) { toast(isW ? '운동 이름을 입력해주세요' : '책 제목을 입력해주세요'); return; }
    setLife(d, skey, out);
    save(); closeModal(); render(); toast(K.done);
  };
  if (items.length) $('#lf-del').onclick = () => {
    setLife(d, skey, null);
    save(); closeModal(); render(); toast('기록을 지웠어요');
  };
  if (!items.length) setTimeout(() => { const i = $('#lf-rows input'); if (i) i.focus(); }, 250);
}

/* ============================================================
   모달: 메모장
   ============================================================ */
function memoModal(id, presetDate) {
  const m = id ? memoById(id) : null;
  if (id && !m) return;
  let pinned = m ? !!m.pinned : false;
  const date = m ? (m.date || '') : (presetDate || '');
  const isDiary = !!date;
  openModal(`
    <div class="m-title">${m ? (m.date ? '이 날의 글' : '메모') : (isDiary ? '이 날의 글' : '새 메모')}
      <button class="btn btn-sm ${pinned ? 'btn-primary' : ''}" id="mm-pin">📌 ${pinned ? '고정됨' : '고정'}</button></div>
    <div class="field">
      <label>날짜 <span style="color:var(--faint);font-weight:500">— 넣으면 달력의 그 날에 함께 보여요</span></label>
      <div style="display:flex;gap:7px">
        <input class="input" type="date" id="mm-date" value="${esc(date)}" style="flex:1">
        <button type="button" class="btn btn-ghost" id="mm-date-clear" style="flex:none">지우기</button>
      </div>
    </div>
    <div class="field">
      <textarea class="input memo-ta" id="mm-text" maxlength="5000" placeholder="첫 줄이 제목이 돼요&#10;자유롭게 적어보세요">${m ? esc(m.text) : ''}</textarea>
      ${m ? `<div style="font-size:.74rem;color:var(--faint);margin-top:6px">만든 날 ${memoTimeLabel(m.createdAt)} · 마지막 수정 ${memoTimeLabel(m.updatedAt)}</div>` : ''}
    </div>
    <div class="m-actions">
      ${m ? '<button class="btn btn-danger" id="mm-del">삭제</button>' : ''}
      <button class="btn" data-action="close-modal">취소</button>
      <button class="btn btn-primary" id="mm-save" style="flex:1">저장</button>
    </div>
  `);
  const ta = $('#mm-text');
  $('#mm-date-clear').onclick = () => { $('#mm-date').value = ''; };
  $('#mm-pin').onclick = function () {
    pinned = !pinned;
    this.className = `btn btn-sm ${pinned ? 'btn-primary' : ''}`;
    this.textContent = `📌 ${pinned ? '고정됨' : '고정'}`;
  };
  $('#mm-save').onclick = () => {
    const text = ta.value.replace(/\s+$/, '');
    if (!text.trim()) { toast('내용을 입력해주세요'); ta.focus(); return; }
    const d = $('#mm-date').value || null;
    const now = new Date().toISOString();
    if (m) {
      const changed = m.text !== text || !!m.pinned !== pinned || (m.date || null) !== d;
      m.text = text; m.pinned = pinned;
      if (d) m.date = d; else delete m.date;
      if (changed) m.updatedAt = now;
    } else {
      const memo = { id: uid(), text, pinned, createdAt: now, updatedAt: now };
      if (d) memo.date = d;
      S.memos.push(memo);
    }
    save(); closeModal(); render();
    toast(m ? '글을 수정했어요 ✏️' : d ? `${fmtKoShort(d)} 글을 남겼어요 ✏️` : '메모를 남겼어요 ✏️');
  };
  if (m) $('#mm-del').onclick = async () => {
    closeModal();
    if (await confirmDlg('메모 삭제', `'${memoTitle(m)}' 메모를 삭제할까요?`, { danger: true, ok: '삭제' })) {
      deleteWithUndo({
        keys: ['memos'], type: 'memo', data: { item: m },
        del: () => { S.memos = S.memos.filter(x => x.id !== m.id); },
        msg: '삭제했어요'
      });
    }
  };
  if (!m) setTimeout(() => ta.focus(), 250);
}

/* ============================================================
   모달: 목표
   ============================================================ */
function goalModal(id, opts) {
  const g = id ? S.goals.find(x => x.id === id) : null;
  const type = g ? g.type : V.goalType;
  const key = g ? g.period : V.goalKey[V.goalType];
  const year = +key.slice(0, 4);
  const years = [year - 1, year, year + 1, year + 2].filter((v, i, a) => a.indexOf(v) === i);
  const curY = +yearKeyOf(todayStr());
  if (!years.includes(curY)) years.push(curY);
  years.sort();

  const pickerHTML = (tp, k) => {
    const y = +k.slice(0, 4);
    let sub = '';

      <div class="seg" id="gl-mode">
        <button type="button" data-mode="metric">📏 측정값</button>

  // 포트폴리오 연동이면 현재값을 실시간 값으로 고정하고 안내 표시

    const note = $('#gl-link-note'), curField = $('#gl-mcur');
    $('#gl-dir').closest('.field').style.display = curLink ? 'none' : '';
    if (curLink) {
      const unit = $('#gl-munit').value.trim() || '만원';

    } else {
      curField.readOnly = false; curField.style.opacity = '';
      note.style.display = 'none';
    }
  };
  const readMetric = () => ({
    dir: curDir,
    unit: $('#gl-munit').value.trim(),
    start: curDir === 'down' && !curLink ? parseNum($('#gl-mstart').value) : null,
    target: parseNum($('#gl-mtarget').value),
    current: curLink ? null : parseNum($('#gl-mcur').value),
    link: curLink || null
  });
  const updatePreview = () => {
    if (curLink) applyLink();   // 단위가 바뀌면 연동 현재값도 갱신
    const m = readMetric();
    const box = $('#gl-metric-preview');
    if (m.target == null) { box.innerHTML = '<span style="color:var(--faint)">목표값을 입력하면 진행률이 자동으로 계산돼요</span>'; return; }
    const sm = metricSummary(m);
    box.innerHTML = `<div class="mp-bar"><div class="progress" style="flex:1"><div style="width:${sm.p}%"></div></div><b>${sm.p}%</b></div>
      <div class="mp-txt">${sm.line}</div>`;
  };
  const applyPreset = p => {
    curDir = p.dir; curLink = p.link || null;
    $('#gl-munit').value = p.unit;
    applyDir(); applyLink(); updatePreview();
  };
  applyMode(); applyDir(); applyLink(); updatePreview();
  $('#gl-mode').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; curMode = b.dataset.mode; applyMode(); });
  $('#gl-dir').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (!b) return; curDir = b.dataset.dir; applyDir(); updatePreview(); });
  $$('#pm-metric [data-mpreset]').forEach(b => b.onclick = () => {
    const p = GOAL_METRIC_PRESETS.find(x => x.k === b.dataset.mpreset); if (!p) return;
    applyPreset(p);
    $('#gl-mtarget').focus();
  });
  // 자산 탭 등에서 프리셋을 지정해 연 경우 자동 적용
  if (!g && opts && opts.mpreset) {
    const p = GOAL_METRIC_PRESETS.find(x => x.k === opts.mpreset);
    if (p) { curMode = 'metric'; applyMode(); applyPreset(p); }
  }
  ['gl-mstart', 'gl-mcur', 'gl-mtarget', 'gl-munit'].forEach(idn => $('#' + idn).addEventListener('input', updatePreview));
  const slider = $('#gl-prog');
  slider.addEventListener('input', () => $('#gl-prog-v').textContent = slider.value + '%');
  let gdone = g ? !!g.done : false;
  if (g) $('#gl-done').onclick = function () {
    gdone = !gdone;
    this.className = `btn btn-block ${gdone ? 'btn-primary' : 'btn-ghost'}`;
    this.textContent = gdone ? '🏆 달성 완료! — 눌러서 되돌리기' : '🏆 목표 달성으로 표시';
  };
  $('#gl-save').onclick = () => {
    const title = $('#gl-title').value.trim();
    if (!title) { toast('목표를 입력해주세요'); return; }
    const y = $('#gl-year').value;
    const sub = $('#gl-sub') ? $('#gl-sub').value : null;
    const period = curType === 'month' ? `${y}-${pad(+sub)}` : curType === 'quarter' ? `${y}-Q${sub}` : String(y);

    let metric = null, ms = [], progress = 0;
    if (curMode === 'metric') {
      const m = readMetric();
      const anyFilled = m.target != null || m.current != null || m.start != null || m.unit;
      if (anyFilled && m.target == null) { toast('목표값을 입력해주세요'); $('#gl-mtarget').focus(); return; }
      if (m.target != null) metric = m;
    } else if (curMode === 'milestone') {
      ms = $$('#gl-ms .sub-line').map(l => ({
        id: l.dataset.sid, title: l.querySelector('input').value.trim(), done: l.dataset.done === '1'
      })).filter(x => x.title);
    } else {
      progress = +slider.value;
    }

    const data = { title, type: curType, period, metric, milestones: ms, progress, memo: $('#gl-memo').value.trim(), done: gdone };
    if (g) Object.assign(g, data);
    else S.goals.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
    V.goalType = curType; V.goalKey[curType] = period;
    save(); closeModal(); render();
    toast(g ? '목표를 수정했어요' : '목표를 세웠어요 🎯');
  };
  if (g) $('#gl-del').onclick = async () => {
    if (await confirmDlg('목표 삭제', `'${g.title}' 목표를 삭제할까요?`, { danger: true, ok: '삭제' })) {
      const todoIds = S.todos.filter(x => x.goalId === g.id).map(x => x.id);
      deleteWithUndo({
        keys: ['goals', 'todos'], type: 'goal', data: { item: g, todoIds },
        del: () => {
          S.goals = S.goals.filter(x => x.id !== g.id);
          S.todos.forEach(t => { if (t.goalId === g.id) t.goalId = null; });
        },
        msg: '목표를 삭제했어요'
      });
    }
  };
  if (!g) setTimeout(() => $('#gl-title').focus(), 250);
}

/* 측정형 목표 — 현재값 빠른 업데이트 */
function goalMetricModal(id) {
  const g = goalById(id); if (!g || !hasMetric(g)) return;
  if (g.metric.link) { toast('이 목표는 내 포트폴리오와 자동으로 연동돼요 🔄'); return; }
  const m = g.metric, up = m.dir === 'up';
  const u = m.unit ? ' ' + esc(m.unit) : '';
  openModal(`
    <div class="m-title">${esc(g.title)} <span class="chip violet">${up ? '누적 기록' : '현재값'}</span></div>
    <div class="field"><label>현재값${m.unit ? ` (${esc(m.unit)})` : ''}</label>
      <input class="input" type="number" step="any" inputmode="decimal" id="gm-in" placeholder="예: ${fmtNum(m.target)}" value="${m.current != null ? fmtNum(m.current) : ''}">
      <div style="font-size:.78rem;color:var(--sub);margin-top:7px">
        🎯 목표 <b>${fmtNum(m.target)}</b>${u}${!up && m.start != null ? ` · 시작 ${fmtNum(m.start)}${u}` : ''}
      </div>
    </div>
    <div class="m-actions">
      ${m.current != null ? `<button class="btn btn-danger" id="gm-clear">지우기</button>` : ''}
      ${up ? `<button class="btn" id="gm-plus">＋ 더하기</button>` : ''}
      <button class="btn btn-primary" id="gm-save" style="flex:1">저장</button>
    </div>
    ${up ? `<div style="font-size:.72rem;color:var(--faint);margin-top:9px;text-align:center">＋ 더하기 = 지금까지 값에 누적 · 저장 = 입력값 그대로</div>` : ''}
  `);
  const input = $('#gm-in');
  const commit = val => {
    g.metric.current = val;
    const p = metricProg(g.metric);
    save(); closeModal(); render();
    if (p >= 100 && !g.done) toast('목표값 달성! 🏆 완료로 표시해보세요');
    else toast('기록했어요 📊');
  };
  $('#gm-save').onclick = () => {
    const v = parseNum(input.value);
    if (v == null) { toast('숫자를 입력해주세요'); input.focus(); return; }
    commit(Math.round(v * 100) / 100);
  };
  if (up) $('#gm-plus').onclick = () => {
    const add = parseNum(input.value);
    if (add == null) { toast('더할 숫자를 입력해주세요'); input.focus(); return; }
    const base = m.current != null ? +m.current : 0;
    commit(Math.round((base + add) * 100) / 100);
  };
  if (m.current != null) $('#gm-clear').onclick = () => commit(null);
  setTimeout(() => input.focus(), 250);
}
