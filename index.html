function searchModal() {
  openModal(`
    <div class="m-title">검색</div>
    <input class="input" id="q-in" placeholder="할 일 · 태그 · 메모장 검색">
    <div class="search-res" id="q-res"><div class="empty">검색어를 입력해보세요</div></div>
  `);
  const qin = $('#q-in');
  qin.addEventListener('input', () => {
    const q = qin.value.trim().toLowerCase();
    const box = $('#q-res');
    if (!q) { box.innerHTML = '<div class="empty">검색어를 입력해보세요</div>'; return; }
    const hits = S.todos.filter(t =>
      t.title.toLowerCase().includes(q) ||
      (t.memo || '').toLowerCase().includes(q) ||
      (t.tags || []).some(tag => tag.toLowerCase().includes(q))
    ).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
    const memoHits = sortedMemos().filter(m => m.text.toLowerCase().includes(q)).slice(0, 20);
    if (!hits.length && !memoHits.length) { box.innerHTML = '<div class="empty">결과가 없어요</div>'; return; }
    let html = '', lastDate = '';
    for (const t of hits) {
      if (t.date !== lastDate) { html += `<div class="sr-date">${fmtKo(t.date)}</div>`; lastDate = t.date; }
      html += todoHTML(t);
    }
    if (memoHits.length) {
      html += `<div class="sr-date">📝 메모장 ${memoHits.length}개</div>`;
      html += memoHits.map(memoCardHTML).join('');
    }
    box.innerHTML = html;
  });
  setTimeout(() => qin.focus(), 250);
}

/* ============================================================
   공유 카드
   ============================================================ */
function shareStats(rangeKey) {
  const r = statsRangeOf(rangeKey);
  const st = rangeStats(r.start, r.end);
  // 기간 내 기분 최빈값
  const moods = [];
  for (const d of dateRange(r.start, r.end > todayStr() ? todayStr() : r.end)) {
    const ref = S.reflections[d];
    if (ref && ref.mood != null) moods.push(ref.mood);
  }
  const moodTop = moods.length ? MOODS[moods.sort((a, b) =>
    moods.filter(x => x === a).length - moods.filter(x => x === b).length).pop()] : null;
  // 이 기간과 겹치는 목표
  const goals = S.goals.filter(g => {
    const pr = periodRange(g.type, g.period);
    return pr.start <= r.end && pr.end >= r.start;
  }).sort((a, b) => goalProg(b) - goalProg(a)).slice(0, 4);
  return { ...r, ...st, bestStreak: maxBestStreak(), curStreak: maxCurStreak(), moodTop, goals, rangeKey };
}
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawShareCard(data, includeGoals) {
  const cv = $('#share-canvas');
  const showGoals = includeGoals && data.goals.length;
  cv.height = showGoals ? 1350 : 1130;
  const ctx = cv.getContext('2d');
  const W = 1080, H = cv.height;
  const F = w => `${w} "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;

  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#f2fbf7'); bg.addColorStop(.5, '#f7f9fa'); bg.addColorStop(1, '#eef8f3');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // 헤더
  ctx.fillStyle = '#059669'; ctx.font = F('800 44px'); ctx.textAlign = 'left';
  ctx.fillText('🌱 동건루틴', 72, 108);
  ctx.fillStyle = '#9ca3af'; ctx.font = F('600 28px'); ctx.textAlign = 'right';
  ctx.fillText(todayStr().replace(/-/g, '.'), W - 72, 106);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#6b7280'; ctx.font = F('600 32px');
  ctx.fillText(`${S.settings.name}님의 기록`, 72, 178);
  ctx.fillStyle = '#111827'; ctx.font = F('800 62px');
  ctx.fillText(data.label, 72, 248);

  // 완료율 링
  const cx = 300, cy = 430, R = 118;
  ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.strokeStyle = '#e5e7eb';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  if (data.rate > 0) {
    ctx.strokeStyle = '#10b981';
    ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * data.rate / 100); ctx.stroke();
  }
  ctx.fillStyle = '#111827'; ctx.font = F('800 72px'); ctx.textAlign = 'center';
  ctx.fillText(`${data.rate}%`, cx, cy + 12);
  ctx.fillStyle = '#6b7280'; ctx.font = F('600 28px');
  ctx.fillText('완료율', cx, cy + 58);

  // 숫자 스탯
  const stats = [
    [`${data.done}/${data.total}`, '완료한 일'],
    [`${data.activeDays}일`, '활동한 날'],
    [`🔥 ${data.bestStreak}일`, '최고 스트릭'],
    [data.moodTop ? `${data.moodTop} ${data.reflDays}일` : `✍️ ${data.reflDays}일`, '회고 기록']
  ];
  stats.forEach(([v, l], i) => {
    const x = 520, y = 320 + i * 82;
    ctx.textAlign = 'left';
    roundRectPath(ctx, x, y - 44, 488, 66, 18);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
    ctx.fillStyle = '#111827'; ctx.font = F('800 34px');
    ctx.fillText(v, x + 28, y + 2);
    ctx.fillStyle = '#9ca3af'; ctx.font = F('600 25px'); ctx.textAlign = 'right';
    ctx.fillText(l, x + 460, y + 1);
    ctx.textAlign = 'left';
  });

  // 활동 히트맵 (최근 12주)
  ctx.fillStyle = '#374151'; ctx.font = F('700 30px');
  ctx.fillText('활동 기록', 72, 660);
  ctx.fillStyle = '#9ca3af'; ctx.font = F('500 23px'); ctx.textAlign = 'right';
  ctx.fillText('최근 12주', W - 72, 660);
  ctx.textAlign = 'left';
  const heatColors = ['#e8ecef', '#c7ecdb', '#8edcba', '#3fc492', '#0ea472'];
  const cell = 64, gap = 12, hx0 = 72, hy0 = 690;
  const wkStart = weekDates(todayStr())[0];
  for (let c = 0; c < 12; c++) {
    const colStart = addDays(wkStart, -7 * (11 - c));
    for (let rr = 0; rr < 7; rr++) {
      const d = addDays(colStart, rr);
      const x = hx0 + c * (cell + gap), yy = hy0 + rr * ((cell - 26) + 8);
      let fill = heatColors[0];
      if (d <= todayStr()) fill = heatColors[heatLevel(dayStats(d).done)];
      else fill = '#f3f4f6';
      roundRectPath(ctx, x, yy, cell, cell - 26, 10);
      ctx.fillStyle = fill; ctx.fill();
    }
  }

  // 목표
  if (showGoals) {
    ctx.fillStyle = '#374151'; ctx.font = F('700 30px');
    ctx.fillText('🎯 목표 진행', 72, 1075);
    data.goals.forEach((g, i) => {
      const y = 1105 + i * 52;
      const p = goalProg(g);
      let title = g.title.length > 15 ? g.title.slice(0, 15) + '…' : g.title;
      ctx.fillStyle = '#111827'; ctx.font = F('600 27px');
      ctx.fillText(title, 72, y + 26);
      // bar
      roundRectPath(ctx, 530, y + 4, 400, 22, 11);
      ctx.fillStyle = '#e5e7eb'; ctx.fill();
      if (p > 0) {
        roundRectPath(ctx, 530, y + 4, Math.max(22, 400 * p / 100), 22, 11);
        ctx.fillStyle = g.done ? '#f59e0b' : '#10b981'; ctx.fill();
      }
      ctx.fillStyle = '#374151'; ctx.font = F('700 26px'); ctx.textAlign = 'right';
      ctx.fillText(`${p}%`, W - 72, y + 26);
      ctx.textAlign = 'left';
    });
  }

  // 푸터
  ctx.fillStyle = '#9ca3af'; ctx.font = F('500 23px'); ctx.textAlign = 'center';
  ctx.fillText('나의 하루가 쌓여 목표가 됩니다 · 동건루틴', W / 2, H - 44);
  ctx.textAlign = 'left';
  return cv;
}

async function onCloudLogin(user) {
  cloud.user = user;
  cloud.paused = false;
  try {
    const remote = await FB.loadData(user.uid);
    if (!remote || !remote.data || isTrivial(remote.data)) {
      await pushCloud();                        // 클라우드가 비어있음 → 내 데이터 업로드
    } else if (isTrivial(S)) {
      applyRemote(remote.data);                 // 이 기기가 비어있음 → 클라우드 사용
      toast('클라우드 데이터를 불러왔어요 ☁️');
    } else if ((remote.data.meta || {}).updatedAt !== S.meta.updatedAt) {
      const choice = await chooseDataDlg(remote.data);
      if (choice === 'cloud') { applyRemote(remote.data); toast('클라우드 데이터로 맞췄어요 ☁️'); }
      else if (choice === 'local') { await pushCloud(); }
      else {
        // 아직 안 골랐으면 어느 쪽도 건드리지 않아요. 실시간 반영도 켜지 않습니다.
        cloud.paused = true;
        toast('동기화를 멈췄어요 — 설정에서 다시 고를 수 있어요');
        render();
        return;
      }
    }
    FB.listen(user.uid, payload => {            // 다른 기기의 변경을 실시간 반영
      if (!payload || !payload.data) return;
      if (payload.device === deviceId) return;
      const rt = (payload.data.meta || {}).updatedAt, lt = S.meta.updatedAt;
      if (!rt || rt === lt) return;
      if (lt && rt < lt) return;                // 늦게 도착한 옛 데이터가 새 데이터를 덮지 않게
      applyRemote(payload.data);
    });
  } catch (e) { console.warn('클라우드 연결 실패', e); }
  if (V.tab === 'settings') render();
}
async function cloudLogin() {
  if (!window.FIREBASE_CONFIG) { toast('클라우드 설정이 아직 완료되지 않았어요'); return; }
  if (!FB) { toast('동기화 모듈을 못 불러왔어요 — 인터넷 연결을 확인해주세요'); return; }
  // 모든 기기에서 팝업 우선 — 리다이렉트는 모바일 브라우저의
  // 서드파티 저장소 차단 정책 때문에 결과가 소실될 수 있음
  try {
    await FB.login();
  } catch (e) {
    const c = (e && e.code) || '';
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {
      try { await FB.loginRedirect(); }
      catch (e2) { toast('로그인 실패: ' + ((e2 && e2.code) || '알 수 없는 오류')); }
    } else if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') {
      /* 사용자가 창을 닫음 — 조용히 넘어감 */
    } else if (c === 'auth/unauthorized-domain') {
      toast('이 주소가 Firebase 승인 도메인 목록에 없어요');
    } else {
      toast('로그인 실패: ' + (c || '알 수 없는 오류'));
    }
  }
}

let confettiRAF = null;
function confettiBurst() {
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const old = document.getElementById('confetti-cv');
  if (old) old.remove();
  if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = null; }
  const cv = document.createElement('canvas');
  cv.id = 'confetti-cv';
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300';
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const colors = ['#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#a78bfa', '#f97316', '#facc15'];
  const ps = Array.from({ length: 90 }, () => ({
    x: W * (0.5 + (Math.random() - 0.5) * 0.55),
    y: H * 0.24 + (Math.random() - 0.5) * 30,
    vx: (Math.random() - 0.5) * 6.5,
    vy: -(2.5 + Math.random() * 6.5),
    w: 5 + Math.random() * 5, h: 8 + Math.random() * 6,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.28,
    c: colors[Math.random() * colors.length | 0]
  }));
  const t0 = performance.now();
  const tick = now => {
    const el = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += 0.16; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, 1.9 - el));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (el < 1.9) confettiRAF = requestAnimationFrame(tick);
    else { cv.remove(); confettiRAF = null; }
  };
  confettiRAF = requestAnimationFrame(tick);
}

function trackVisit() {
  const t = todayStr();
  if (S.meta.lastVisit === t) return;
  S.meta.visitStreak = S.meta.lastVisit === addDays(t, -1) ? (S.meta.visitStreak || 0) + 1 : 1;
  S.meta.lastVisit = t;
  if ((S.meta.visitStreak || 0) > (S.meta.bestVisitStreak || 0)) S.meta.bestVisitStreak = S.meta.visitStreak;
  save();
  const n = S.meta.visitStreak;
  if ([7, 14, 30, 50, 100, 200, 365].includes(n)) setTimeout(() => toast(`📅 ${n}일 연속 방문! 꾸준함이 실력이에요 🔥`), 900);
}

/* 주간 리포트 — 매주 첫 방문 시 지난주 요약을 보여줘요 */
function maybeWeeklyReport() {
  const thisStart = weekDates(todayStr())[0];
  if ((S.meta.firstUse || todayStr()) >= thisStart) return;      // 아직 지난주가 없음
  if (S.meta.lastWeeklyReport === thisStart) return;             // 이번 주에 이미 봄
  if ($('#modal-root').classList.contains('open')) return;       // 다른 창이 열려 있으면 다음 기회에
  const start = addDays(thisStart, -7), end = addDays(thisStart, -1);
  const st = rangeStats(start, end);
  S.meta.lastWeeklyReport = thisStart;
  save();
  if (!st.total && !st.reflDays) return;                         // 지난주 기록이 없으면 조용히
  weeklyReportModal();
}
function weeklyReportModal() {
  const thisStart = weekDates(todayStr())[0];
  const start = addDays(thisStart, -7), end = addDays(thisStart, -1);
  const st = rangeStats(start, end);
  const prev = rangeStats(addDays(start, -7), addDays(start, -1));
  const delta = st.rate - prev.rate;
  let best = null;
  for (const d of dateRange(start, end)) {
    const s = dayStats(d);
    if (s.done > 0 && (!best || s.done > best.done)) best = { d, done: s.done };
  }
  const rws = activeRoutines().map(r => {
    let tot = 0, done = 0;
    for (const d of dateRange(start, end)) if (routineOn(r, d)) { tot++; if (isRDone(r.id, d)) done++; }
    return { r, tot, done };
  }).filter(x => x.tot > 0).sort((a, b) => b.done / b.tot - a.done / a.tot);
  const tks = activeTrackers().filter(tk => tk.type === 'number').map(tk => {
    const es = trackerEntries(tk, start, end);
    if (!es.length) return null;
    const dv = Math.round((+es[es.length - 1].v - +es[0].v) * 100) / 100;
    return { tk, dv };
  }).filter(Boolean);
  const hasAny = st.total > 0 || st.reflDays > 0;
  openModal(`
    <div class="m-title">📮 지난주 리포트 <span class="chip">${fmtKoShort(start)} ~ ${fmtKoShort(end)}</span></div>

/* 길게 누르기 — data-long="액션" 이 붙은 요소를 0.5초 누르면 그 액션을 실행 */
let longPress = null, longFired = false;
document.addEventListener('pointerdown', e => {
  longFired = false;                       // 새로 누르면 항상 초기화 (클릭이 안 왔던 경우 대비)
  const el = e.target.closest('[data-long]');
  if (!el) return;
  longPress = {
    x: e.clientX, y: e.clientY, el,
    timer: setTimeout(() => {
      longFired = true; longPress = null;
      vib();
      runAction(el.dataset.long, el);
    }, 500)
  };
}, { passive: true });
function longCancel() { if (longPress) { clearTimeout(longPress.timer); longPress = null; } }
document.addEventListener('pointermove', e => {
  if (!longPress) return;
  if (Math.abs(e.clientX - longPress.x) > 10 || Math.abs(e.clientY - longPress.y) > 10) longCancel();
}, { passive: true });
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, longCancel, { passive: true }));
document.addEventListener('scroll', longCancel, { passive: true, capture: true });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-long]')) e.preventDefault(); });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (longFired) { longFired = false; return; }   // 길게 누른 직후의 클릭은 무시
  await runAction(el.dataset.action, el, e);
});
async function runAction(a, el, e = { stopPropagation() {}, preventDefault() {} }) {
  const id = el.dataset.id;

  switch (a) {
    /* --- 내비/공통 --- */
    case 'tab': setTab(el.dataset.tab); break;
    case 'close-modal': closeModal(); break;
    case 'toast-undo': { const fn = toastUndo; hideToast(); if (fn) fn(); break; }
    case 'open-search': searchModal(); break;
    case 'fab':
      if (V.tab === 'goals') goalModal();
      else if (V.tab === 'memos') memoModal();
      else if (V.tab === 'calendar') todoModal(null, V.calSel);
      else todoModal(null, V.date);
      break;

    /* --- 오늘 --- */
    case 'pick-day': V.date = el.dataset.date; render(); break;
    case 'week-nav': V.date = addDays(V.date, +el.dataset.d); render(); break;
    case 'toggle-todo': {
      const t = S.todos.find(x => x.id === id); if (!t) break;
      t.done = !t.done;
      t.doneAt = t.done ? new Date().toISOString() : null;
      if (t.done) { (t.subtasks || []).forEach(s => s.done = true); vib(); }
      save(); render();
      if (t.done) {
        const st = dayStats(t.date);
        if (st.total > 0 && st.done >= st.total) {
          toast(t.date === todayStr() ? '오늘 할 일 전부 완료! 🎉' : '이 날의 일정 전부 완료! 🎉');
          confettiBurst();
        }
      }
      break;
    }
    case 'toggle-routine': {
      e.stopPropagation();
      toggleRoutineLog(id, el.dataset.date);
      save(); render();
      const r = S.routines.find(x => x.id === id);
      if (r && isRDone(id, el.dataset.date)) {
        const st = dayStats(el.dataset.date);
        if (st.total > 0 && st.done >= st.total) {
          toast(el.dataset.date === todayStr() ? '오늘 할 일 전부 완료! 🎉' : '이 날의 일정 전부 완료! 🎉');
          confettiBurst();
        } else {
          const stk = rCurStreak(r);
          if (stk >= 3) toast(`🔥 ${stk}일 연속! 대단해요`);
        }
      }
      break;
    }
    case 'move-today': {
      const t = S.todos.find(x => x.id === id); if (!t) break;
      t.date = todayStr(); save(); render(); toast('오늘로 가져왔어요 📌');
      break;
    }
    case 'edit-todo': todoModal(id); break;
    case 'todo-menu': todoMenu(id); break;
    case 'mood': {
      const d = el.dataset.date;
      const input = $('#refl-text');
      const cur = S.reflections[d] || { text: '' };
      S.reflections[d] = { mood: +el.dataset.mood, text: input ? input.value.trim() : (cur.text || '') };
      save(); render(); vib();
      break;
    }
    case 'save-refl': saveReflection(el.dataset.date); break;
    case 'copy-quote': {
      const q = dailyQuote(el.dataset.date || todayStr());
      try { await navigator.clipboard.writeText(`"${q.t}" — ${q.a}`); toast('명언을 복사했어요 📋'); }
      catch (err) { toast('이 환경에선 복사가 지원되지 않아요'); }

    case 'en-word': el.classList.toggle('open'); break;   // 단어를 누르면 예문이 펼쳐져요

    /* --- 루틴 --- */

    case 'manage-trackers': trackersManager(); break;
    case 'add-tracker': trackerModal(); break;
    case 'edit-tracker-m': trackerModal(id); break;
    case 'preset-tracker': {
      const p = TRACKER_PRESETS[el.dataset.k]; if (!p) break;
      if (S.trackers.some(x => x.name === p.name && !x.archived)) { toast('이미 있는 항목이에요'); break; }
      S.trackers.push({ id: uid(), createdAt: new Date().toISOString(), goalId: null, target: null, archived: false, ...p });
      save(); render(); toast(`'${p.name}' 기록을 시작해요 ${p.emoji}`);
      break;
    }

    /* --- 라이프로그(식단·운동·독서·활동) --- */
    case 'life-modal': lifeModal(el.dataset.k, el.dataset.date); break;
    case 'life-rm': el.closest('.life-line').remove(); break;
    case 'fit-guide': fitGuideModal(el.dataset.date || todayStr()); break;
    case 'food-add': {                       // 목록에 없는 음식을 그 자리에서 등록
      const name = el.dataset.name || '';
      const box = document.createElement('span');
      box.innerHTML = `<input class="mk-kin" type="number" min="0" inputmode="numeric" placeholder="kcal"
          style="width:66px;border:1.5px solid var(--line);border-radius:8px;padding:2px 6px;font-size:.74rem;background:var(--card)">
        <button type="button" class="mk-add" data-action="food-save" data-name="${esc(name)}">저장</button>`;
      el.replaceWith(box);
      const inp = box.querySelector('input');
      inp.focus();
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); box.querySelector('[data-action=food-save]').click(); }
      });
      break;
    }
    case 'food-save': {
      const wrap = el.parentElement;
      const inp = wrap && wrap.querySelector('.mk-kin');
      const v = inp ? parseFloat(inp.value) : NaN;
      const name = (el.dataset.name || '').trim();
      if (!name || isNaN(v) || v <= 0) { toast('kcal을 숫자로 적어주세요'); break; }
      if (!Array.isArray(S.foodDB)) S.foodDB = [];
      const hit = S.foodDB.find(x => foodNorm(x.n) === foodNorm(name));
      if (hit) hit.k = Math.round(v);
      else S.foodDB.unshift({ n: name, k: Math.round(v), u: '1인분' });
      save();

    case 'food-del': {

      toast(`'${gone.n}' 을(를) 지웠어요`, { undo: () => restoreSnapshot(snap) });
      break;
    }

    /* --- 메모장 --- */
    case 'add-memo': memoModal(); break;
    case 'edit-memo': memoModal(id); break;
    case 'memo-filter': V.memoFilter = el.dataset.k; render(); break;
    case 'memo-pin': {

      break;
    }

    /* --- 달력 --- */
    case 'cal-nav': V.calMonth = periodShift('month', V.calMonth, +el.dataset.d); render(); break;
    case 'cal-today': V.calMonth = monthKeyOf(todayStr()); V.calSel = todayStr(); render(); break;

    case 'cal-day': {

      if (monthKeyOf(d) !== V.calMonth) V.calMonth = monthKeyOf(d);
      if (V.calView === 'agenda') V.calView = 'month';   // 목록에서 날짜를 누르면 그 날 상세로
      render(); break;
    }
    case 'cal-div': V.divMonth = +el.dataset.m; V.assetTab = 'now'; setTab('assets'); break;
    case 'add-todo-date': todoModal(null, el.dataset.date); break;
    case 'add-diary': memoModal(null, el.dataset.date); break;
    case 'cal-add': todoModal(null, el.dataset.date); break;

    /* --- 목표 --- */
    case 'goal-type': V.goalType = el.dataset.type; render(); break;
    case 'goal-nav': V.goalKey[V.goalType] = periodShift(V.goalType, V.goalKey[V.goalType], +el.dataset.d); render(); break;
    case 'goal-now': V.goalKey[V.goalType] = curKey(V.goalType); render(); break;
    case 'edit-goal': goalModal(id); break;
    case 'log-metric': goalMetricModal(id); break;
    case 'toggle-ms': {
      const g = goalById(el.dataset.goal); if (!g) break;
      const m = g.milestones.find(x => x.id === el.dataset.ms); if (!m) break;
      m.done = !m.done; vib();
      const p = goalProg(g);
      save(); render();
      if (p === 100 && !g.done) toast('모든 단계 달성! 🏆 목표를 완료로 표시해보세요');

    /* --- 자산(포트폴리오) --- */
    case 'asset-cur': V.assetCur = el.dataset.k; S.settings.assetCur = el.dataset.k; save(); render(); break;
    case 'div-month': V.divMonth = V.divMonth === +el.dataset.m ? null : +el.dataset.m; render(); break;
    case 'hold-sort': V.holdSort = el.dataset.k; render(); break;
    case 'hold-open': V.holdOpen = V.holdOpen === el.dataset.t ? null : el.dataset.t; render(); break;
    case 'new-asset-goal': goalModal(null, { mpreset: 'pf_assets' }); break;
    case 'new-div-goal': goalModal(null, { mpreset: 'pf_div' }); break;
    case 'asset-tab': V.assetTab = el.dataset.k; render(); break;
    case 'hx-div-year': V.hxDivYear = +el.dataset.y; render(); break;
    case 'hx-snap': V.hxSnap = el.dataset.k; render(); break;

    /* --- 통계/공유 --- */
    case 'stats-range': V.statsRange = el.dataset.k; render(); break;
    case 'open-share': shareModal(); break;
    case 'weekly-report': weeklyReportModal(); break;
    case 'wr-share': closeModal(); shareModal('week'); break;

    /* --- 설정 --- */
    case 'set-theme': S.settings.theme = el.dataset.k; save(); applyTheme(); render(); break;
    case 'set-ws': S.settings.weekStart = +el.dataset.k; save(); render(); break;

    case 'trash-restore': trashRestore(id); trashModal(); break;

        { danger: true, ok: '비우기' })) {
        S.trash = []; save(); render(); toast('휴지통을 비웠어요');
      }
      break;
    case 'install':
      if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; }
      break;

    case 'cloud-resync': if (cloud.user) { cloud.paused = false; onCloudLogin(cloud.user); } break;
    case 'cloud-logout':
      if (await confirmDlg('로그아웃', '자동 동기화가 꺼져요. 데이터는 이 기기에 그대로 남아요.', { ok: '로그아웃' })) cloudLogout();
      break;

    case 'modal-sub-add': {

      box.insertAdjacentHTML('beforeend', subLineHTML());
      box.lastElementChild.querySelector('input').focus();

    case 'modal-sub-toggle': {

      line.classList.toggle('on', on);

    /* --- 할 일 메뉴 --- */
    case 'menu-edit': closeModal(); todoModal(id); break;
    case 'menu-move': closeModal(); moveDateModal(id); break;
    case 'move-to': moveTodoTo(id, el.dataset.date); break;
    case 'menu-today': {
      const t = S.todos.find(x => x.id === id);
      if (t) { t.date = todayStr(); save(); }
      closeModal(); render(); toast('오늘로 가져왔어요 📌');
      break;
    }
    case 'menu-tomorrow': {
      const t = S.todos.find(x => x.id === id);
      if (t) {
        t.date = addDays(t.date < todayStr() ? todayStr() : t.date, 1);
        save();
      }
      closeModal(); render(); toast('내일로 미뤘어요 ⏭️');
      break;
    }
    case 'menu-copy': {
      const t = S.todos.find(x => x.id === id);
      if (t) {
        const c = JSON.parse(JSON.stringify(t));
        c.id = uid(); c.done = false; c.doneAt = null; c.createdAt = new Date().toISOString();
        (c.subtasks || []).forEach(s => { s.id = uid(); s.done = false; });
        S.todos.push(c); save();
      }
      closeModal(); render(); toast('복제했어요 📋');
      break;
    }
    case 'menu-del': {
      const t = S.todos.find(x => x.id === id);
      closeModal();
      if (t && await confirmDlg('할 일 삭제', `'${t.title}'을(를) 삭제할까요?`, { danger: true, ok: '삭제' })) {
        deleteWithUndo({
          keys: ['todos'], type: 'todo', data: { item: t },
          del: () => { S.todos = S.todos.filter(x => x.id !== id); },
          msg: '삭제했어요'
        });
      }
      break;
    }
  }
}

/* ============================================================
   렌더 루트 / 테마 / 초기화
   ============================================================ */
function setTab(tab) {
  V.tab = tab;
  if (tab === 'today') V.date = V.date || todayStr();
  render();
  window.scrollTo({ top: 0 });
}
function render() {
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === V.tab));
  $$('.view').forEach(v => {
    const on = v.dataset.view === V.tab;
    v.classList.toggle('active', on);
    if (!on && v.innerHTML) v.innerHTML = '';   // 비활성 뷰를 비워 중복 id로 인한 오동작 방지
  });
  ({ today: renderToday, calendar: renderCalendar, memos: renderMemos, goals: renderGoals, assets: renderAssets, stats: renderStats, settings: renderSettings })[V.tab]();
  $('#fab').classList.toggle('hide', V.tab === 'stats' || V.tab === 'settings' || V.tab === 'assets');
}
function applyTheme() {
  const t = S.settings.theme;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#meta-theme').content = dark ? '#0f1316' : '#f7f8fa';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if (V.tab === 'settings') render();
});
// 자정 넘김 감지
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && todayStr() !== lastDay) {
    lastDay = todayStr();
    if (V.date < lastDay) V.date = lastDay;
    V.calMonth = monthKeyOf(lastDay); V.calSel = lastDay;
    trackVisit();
    render();
    maybeWeeklyReport();
  }
});
// 모바일 스와이프: 오늘 탭 = 날짜 이동, 달력 탭 = 월 이동 (손가락을 따라오는 자연스러운 드래그)
function slideAnim(dir) {
  const v = document.querySelector('.view.active');
  if (!v) return;
  v.classList.remove('slide-l', 'slide-r');
  void v.offsetWidth;
  v.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
}
const swipeableTab = () => V.tab === 'today' || V.tab === 'calendar';
function swipePeekLabel(dir) {
  if (V.tab === 'today') { const d = parseDate(addDays(V.date, dir)); return `${d.getMonth() + 1}/${d.getDate()} ${KD[d.getDay()]}`; }
  return periodLabel('month', periodShift('month', V.calMonth, dir));
}
function showPeek(dx) {
  const peek = $('#swipe-peek');
  if (Math.abs(dx) < 12) { peek.classList.remove('on'); peek.style.opacity = ''; return; }
  const fromRight = dx < 0;                     // 왼쪽으로 밀면 = 다음 = 오른쪽에서 들어옴
  peek.className = (fromRight ? 'right' : 'left') + ' on';
  peek.textContent = fromRight ? `${swipePeekLabel(1)} ›` : `‹ ${swipePeekLabel(-1)}`;
  peek.style.opacity = String(Math.min(1, Math.abs(dx) / 110));
}
function hidePeek() { const p = $('#swipe-peek'); p.classList.remove('on'); p.style.opacity = ''; }
function commitSwipe(dir) {
  const el = document.querySelector('.view.active');
  if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
  if (V.tab === 'today') V.date = addDays(V.date, dir);
  else if (V.tab === 'calendar') V.calMonth = periodShift('month', V.calMonth, dir);
  render();
  slideAnim(dir);
}
let swipe = null;
const mainEl = $('#main');
mainEl.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || !swipeableTab()) { swipe = null; return; }
  if ($('#modal-root').classList.contains('open')) { swipe = null; return; }
  if (e.target.closest('.heat-wrap, input, textarea, select, [type=range]')) { swipe = null; return; }
  swipe = { x0: e.touches[0].clientX, y0: e.touches[0].clientY, t: Date.now(), dx: 0, active: false, decided: false, el: null };
}, { passive: true });
mainEl.addEventListener('touchmove', e => {
  if (!swipe) return;
  const dx = e.touches[0].clientX - swipe.x0;
  const dy = e.touches[0].clientY - swipe.y0;
  if (!swipe.decided) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   // 방향이 정해질 때까지 대기
    swipe.decided = true;
    swipe.active = Math.abs(dx) > Math.abs(dy) * 1.2;   // 가로 제스처만 채택
    if (swipe.active) { swipe.el = document.querySelector('.view.active'); if (swipe.el) swipe.el.classList.add('dragging'); }
  }
  if (!swipe.active) return;                            // 세로 스크롤은 그대로 둠
  e.preventDefault();
  swipe.dx = dx;
  const ax = Math.abs(dx);
  const damp = (ax > 140 ? 140 + (ax - 140) * 0.35 : ax) * Math.sign(dx);   // 많이 끌수록 저항
  if (swipe.el) {
    swipe.el.style.transform = `translateX(${damp}px)`;
    swipe.el.style.opacity = String(Math.max(0.4, 1 - ax / 620));
  }
  showPeek(dx);
}, { passive: false });
mainEl.addEventListener('touchend', () => {
  if (!swipe) return;
  const s = swipe; swipe = null;
  hidePeek();
  if (!s.active || !s.el) return;
  s.el.classList.remove('dragging');
  const dt = Date.now() - s.t;
  const w = s.el.offsetWidth || window.innerWidth;
  const fling = Math.abs(s.dx) > 40 && dt < 240;                          // 빠른 플릭
  if (Math.abs(s.dx) > Math.min(130, w * 0.30) || fling) {
    const dir = s.dx < 0 ? 1 : -1;
    s.el.style.transition = 'transform .15s ease, opacity .15s ease';
    s.el.style.transform = `translateX(${(dir > 0 ? -1 : 1) * Math.round(w * 0.55)}px)`;
    s.el.style.opacity = '0';
    setTimeout(() => commitSwipe(dir), 140);
  } else {
    const el = s.el;
    el.style.transition = 'transform .22s cubic-bezier(.2,.85,.3,1), opacity .22s ease';
    el.style.transform = 'translateX(0)';
    el.style.opacity = '1';
    setTimeout(() => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }, 240);
  }
}, { passive: true });
mainEl.addEventListener('touchcancel', () => {
  if (!swipe) return;
  const s = swipe; swipe = null; hidePeek();
  if (s.el) { s.el.classList.remove('dragging'); s.el.style.transition = ''; s.el.style.transform = ''; s.el.style.opacity = ''; }
}, { passive: true });

// 시작
load();
trashSweep();
trackVisit();
if (S.settings.assetCur === 'USD' || S.settings.assetCur === 'KRW') V.assetCur = S.settings.assetCur;
applyTheme();
render();
maybeFitFromHash();
// 앱이 이미 떠 있는 상태에서 #fit=... 주소가 열리면 새로고침이 안 되니 따로 들어 둬요
window.addEventListener('hashchange', maybeFitFromHash);
setTimeout(maybeWeeklyReport, 800);
if ('ontouchstart' in window && !localStorage.getItem('dgr_swipe_hint')) {
  setTimeout(() => toast('👈 좌우로 밀면 날짜가 넘어가요 👉'), 900);
  localStorage.setItem('dgr_swipe_hint', '1');
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
<script type="module">
/* Firebase SDK 로더 — 설정이 있을 때만 동작. 실패해도 앱은 로컬 모드로 정상 동작 */
if (window.FIREBASE_CONFIG) {
  (async () => {
    try {
      const V = '10.12.2';
      const [{ initializeApp }, A, F] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
      ]);
      const app = initializeApp(window.FIREBASE_CONFIG);
      const auth = A.getAuth(app);
      const db = F.initializeFirestore(app, {
        ignoreUndefinedProperties: true,
        localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() })
      });
      A.getRedirectResult(auth).catch(e => console.warn('리다이렉트 로그인 결과 처리 실패:', e));
      let unsub = null;
      window.__fbInit({
        onAuth: cb => A.onAuthStateChanged(auth, cb),
        login: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
        loginRedirect: () => A.signInWithRedirect(auth, new A.GoogleAuthProvider()),
        logout: () => { if (unsub) { unsub(); unsub = null; } return A.signOut(auth); },
        saveData: (uid, payload) => F.setDoc(F.doc(db, 'users', uid), { ...payload, updatedAt: F.serverTimestamp() }),
        loadData: async uid => { const s = await F.getDoc(F.doc(db, 'users', uid)); return s.exists() ? s.data() : null; },
        listen: (uid, cb) => {
          if (unsub) unsub();
          unsub = F.onSnapshot(F.doc(db, 'users', uid), s => {
            if (s.metadata.hasPendingWrites) return;
            cb(s.exists() ? s.data() : null);
          });
        }
      });
    } catch (e) { console.warn('Firebase 초기화 실패 — 로컬 모드로 동작:', e); }
  })();
}
</script>
