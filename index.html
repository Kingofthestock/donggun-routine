<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="동건루틴 — 나만의 할 일 · 루틴 · 목표 관리">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f8fa" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동건루틴">
<title>동건루틴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ============================================================
   동건루틴 — 밝은 미니멀 디자인
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f8fa; --card:#ffffff; --card2:#f1f3f5;
  --text:#1a1d21; --sub:#697180; --faint:#9aa3b0; --line:#e7eaee;
  --accent:#10b981; --accent-dark:#059669; --accent-soft:#e6f7f0; --accent-soft2:#d1fae5;
  --red:#ef4444; --red-soft:#fdecec; --amber:#f59e0b; --blue:#3b82f6;
  --violet:#7c5cf0; --violet-soft:#efeafd;
  --heat0:#eceff3; --heat1:#c7ecdb; --heat2:#8edcba; --heat3:#3fc492; --heat4:#0ea472;
  --shadow:0 1px 3px rgba(20,30,40,.06), 0 1px 2px rgba(20,30,40,.04);
  --shadow-lg:0 8px 30px rgba(20,30,40,.12);
  --radius:16px;
  --nav-h:62px;
}
[data-theme="dark"]{
  --bg:#0f1316; --card:#181d22; --card2:#20262c;
  --text:#eaeef1; --sub:#98a3ad; --faint:#5f6a74; --line:#29313a;
  --accent:#2fd39a; --accent-dark:#25b985; --accent-soft:#12332a; --accent-soft2:#154236;
  --red:#f47171; --red-soft:#3a1f22; --amber:#f5b04b; --blue:#6aa5f8;
  --violet:#a78bfa; --violet-soft:#2b2347;
  --heat0:#20262c; --heat1:#12463a; --heat2:#166b52; --heat3:#1c9a70; --heat4:#2fd39a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 8px 30px rgba(0,0,0,.5);
}
html{font-size:15px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  min-height:100vh; overscroll-behavior-y:none;
  touch-action:manipulation;
}
#nav,.item,.wk-day,.cal-cell,.check,.chip,.seg,.mood,.ms,.goal-card,.more{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
::placeholder{color:var(--faint)}

/* ---------- 레이아웃 ---------- */
#main{max-width:640px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px)}
.view{display:none}
.view.active{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- 하단 내비 (모바일) ---------- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 0 7px;color:var(--faint);font-size:.68rem;font-weight:600;
}
.nav-btn svg{width:23px;height:23px}
.nav-btn.active{color:var(--accent-dark)}
[data-theme="dark"] .nav-btn.active{color:var(--accent)}
#nav-logo{display:none}

/* ---------- 데스크톱: 사이드바 ---------- */
@media (min-width:960px){
  :root{--nav-h:0px}
  #nav{
    top:0;bottom:0;right:auto;width:212px;flex-direction:column;justify-content:flex-start;
    border-top:none;border-right:1px solid var(--line);padding:18px 12px;gap:4px;
  }
  #nav-logo{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:800;padding:8px 12px 22px;color:var(--text)}
  .nav-btn{flex:none;flex-direction:row;gap:12px;font-size:.95rem;padding:11px 14px;border-radius:12px;color:var(--sub)}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent-dark)}
  [data-theme="dark"] .nav-btn.active{color:var(--accent)}
  #main{margin-left:212px;max-width:none;padding:26px 40px 60px}
  .desk-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  #main .inner{max-width:860px;margin:0 auto}
}
@media (max-width:959px){ .inner{max-width:100%} }

/* ---------- 공용 컴포넌트 ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px}
.vhead h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.vhead .sub{color:var(--sub);font-size:.86rem;margin-top:2px}
.vhead .actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--sub);
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.94)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{font-weight:700;font-size:1rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title .hint{font-weight:500;font-size:.78rem;color:var(--faint)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:12px;font-weight:700;font-size:.92rem;
  background:var(--card2);color:var(--text);transition:transform .06s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:var(--accent-dark)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:10px}

.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:.86rem;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:700}
[data-theme="dark"] .seg button.on{background:#2c343c}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--card2);color:var(--sub)}
.chip.accent{background:var(--accent-soft);color:var(--accent-dark)}
[data-theme="dark"] .chip.accent{color:var(--accent)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}

.progress{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease}

.empty{padding:34px 10px;text-align:center;color:var(--faint);font-size:.9rem;line-height:1.7}
.empty .big{font-size:1.9rem;display:block;margin-bottom:6px}

/* ---------- 주간 스트립 ---------- */
.week-strip{display:flex;align-items:center;gap:4px;margin-bottom:14px}
.week-strip .wk-arrow{width:26px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.week-days{display:flex;flex:1;gap:4px}
.wk-day{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 7px;border-radius:13px;border:1.5px solid transparent;
}
.wk-day .dow{font-size:.66rem;font-weight:700;color:var(--faint)}
.wk-day .num{font-size:.95rem;font-weight:700}
.wk-day .mini{width:5px;height:5px;border-radius:99px;background:var(--line)}
.wk-day .mini.some{background:var(--amber)}
.wk-day .mini.all{background:var(--accent)}
.wk-day .mini.none{background:transparent}
.wk-day.sel{background:var(--card);border-color:var(--accent);box-shadow:var(--shadow)}
.wk-day.today .num{color:var(--accent-dark)}
[data-theme="dark"] .wk-day.today .num{color:var(--accent)}
.wk-day.sun .dow{color:#e0705f}

/* ---------- 오늘 요약 ---------- */
.today-sum{display:flex;align-items:center;gap:16px}
.today-sum .ring-wrap{flex:none}
.today-sum .ts-main{font-size:1.05rem;font-weight:800}
.today-sum .ts-sub{font-size:.82rem;color:var(--sub);margin-top:3px}
.today-sum .ts-streak{margin-top:7px}

.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--card2)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring-txt{font-weight:800;fill:var(--text)}

/* ---------- 섹션 ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 9px}
.sec-head h2{font-size:.95rem;font-weight:800;display:flex;gap:6px;align-items:center}
.sec-head .cnt{color:var(--faint);font-weight:600;font-size:.82rem}
.sec-head button{color:var(--sub);font-size:.8rem;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--card2)}

/* ---------- 아이템 (할 일 / 루틴) ---------- */
.item{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  padding:12px 12px 12px 14px;margin-bottom:8px;cursor:pointer;
  border-left:3px solid transparent;
}
.item.p2{border-left-color:var(--red)}
.item.p0{border-left-color:transparent}
.item.p1{border-left-color:var(--amber)}
.item.routine{border-left-color:var(--blue)}
.check{
  flex:none;width:24px;height:24px;margin-top:1px;border-radius:8px;
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:.8rem;font-weight:900;transition:all .12s;
  position:relative;
}
.check::after{content:'';position:absolute;inset:-10px}  /* 터치 영역 확대 */
.item.routine .check{border-radius:99px}
.item.done .check{background:var(--accent);border-color:var(--accent);color:#fff}
.item-body{flex:1;min-width:0}
.item-title{font-weight:600;font-size:.95rem;word-break:break-word}
.item.done .item-title{color:var(--faint);text-decoration:line-through}
.item-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.item-meta:empty{display:none}
.subbar{display:flex;align-items:center;gap:7px;margin-top:7px}
.subbar .progress{flex:1;height:5px}
.subbar span{font-size:.7rem;color:var(--faint);font-weight:700}
.more{flex:none;color:var(--faint);width:30px;height:30px;border-radius:9px;font-size:1.05rem;letter-spacing:.5px}
.more:active{background:var(--card2)}
.overdue-box{background:var(--red-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px}
.overdue-box .ob-title{font-weight:800;font-size:.88rem;color:var(--red);margin-bottom:8px}
.overdue-box .item{box-shadow:none;margin-bottom:6px}
.ob-actions{display:flex;gap:6px;flex:none;align-self:center}

/* ---------- 회고 ---------- */
.moods{display:flex;gap:6px;margin-bottom:10px}
.mood{
  flex:1;font-size:1.35rem;padding:7px 0;border-radius:12px;background:var(--card2);
  filter:grayscale(1);opacity:.55;transition:all .15s;
}
.mood.on{background:var(--accent-soft);filter:none;opacity:1;transform:scale(1.08)}
.refl-row{display:flex;gap:8px}
.refl-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;font-size:16px;background:var(--card)}
.refl-row input:focus{outline:none;border-color:var(--accent)}
.refl-done{display:flex;align-items:center;gap:10px}
.refl-done .emoji{font-size:1.7rem}
.refl-done .txt{flex:1;font-size:.92rem;color:var(--text);word-break:break-word}

/* ---------- 달력 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-head .cal-title{font-size:1.12rem;font-weight:800}
.cal-head .cal-nav{display:flex;gap:6px;align-items:center}
/* 칸 크기는 화면 폭이 아니라 '달력이 실제로 차지하는 폭'을 따라가요
   (데스크톱에선 오른쪽에 상세가 붙어서 달력이 절반 폭이 되거든요) */
.cal-card{padding:12px 7px;container-type:inline-size}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:.68rem;font-weight:700;color:var(--faint);padding:3px 0 5px}
.cal-dow.sun{color:#e0705f}
.cal-dow.sat{color:#5b8dd6}
/* 셀 — 구글 캘린더처럼 '일정 제목'이 그대로 보이는 칸 */
.cal-cell{
  position:relative;min-height:78px;border-radius:9px;border:1.5px solid transparent;
  background:var(--bg);display:flex;flex-direction:column;gap:1.5px;
  padding:3px 3px 4px;overflow:hidden;text-align:left;
}
.cal-cell.dim{background:transparent;opacity:.42}
.cal-cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cal-daynum{display:flex;align-items:center;justify-content:space-between;gap:2px}
.cal-daynum .n{
  font-size:.74rem;font-weight:700;line-height:1;min-width:17px;height:17px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:99px;
}
.cal-cell.today .cal-daynum .n{background:var(--accent);color:#fff}
.cal-cell.sunday:not(.today) .cal-daynum .n{color:#e0705f}
.cal-cell.saturday:not(.today) .cal-daynum .n{color:#5b8dd6}
.cal-daynum .mood{font-size:.64rem;line-height:1;flex:none}
.cal-evs{display:flex;flex-direction:column;gap:1.5px;min-height:0}
.cal-ev{
  font-size:.58rem;font-weight:700;line-height:1.55;border-radius:3px;padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em;
  background:var(--accent-soft2);color:var(--accent-dark);
}
[data-theme="dark"] .cal-ev{color:var(--accent)}
.cal-ev.rt{background:var(--violet-soft);color:var(--violet)}
.cal-ev.hi{background:var(--red-soft);color:var(--red)}
.cal-ev.ok{background:transparent;color:var(--faint);text-decoration:line-through}
.cal-ev .tm{display:none;font-style:normal;opacity:.75;margin-right:3px;font-variant-numeric:tabular-nums}
.cal-more{font-size:.55rem;font-weight:700;color:var(--faint);padding-left:2px;line-height:1.5}
.cal-foot{display:flex;align-items:center;gap:4px;margin-top:auto;padding:3px 1px 0}
.cal-marks{display:flex;gap:2.5px;flex:none}
.cal-marks i{width:4px;height:4px;border-radius:99px;flex:none}
/* 루틴 달성 미니 게이지 — 매일 반복되는 루틴은 글자 대신 이 막대로 */
.cal-rt{flex:1;min-width:12px;height:3px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.cal-rt i{display:block;height:100%;border-radius:99px;background:var(--faint)}
.cal-rt.full i{background:var(--accent)}
@container (min-width:430px){
  .cal-card{padding:14px 12px}
  .cal-cell{min-height:88px}
  .cal-ev{font-size:.62rem;padding:0 3px}
}
@container (min-width:600px){
  .cal-cell{min-height:104px;gap:2px}
  .cal-daynum .n{font-size:.82rem;min-width:19px;height:19px}
  .cal-ev{font-size:.68rem;line-height:1.6;padding:1px 4px;border-radius:4px;letter-spacing:0}
  .cal-ev .tm{display:inline}
  .cal-more{font-size:.63rem}
}
/* 데스크톱 — 달력을 상세보다 넓게 */
@media (min-width:960px){ .cal-cols{grid-template-columns:1.25fr 1fr} }
/* 월 요약 스트립 */
.cal-sum{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;padding-bottom:2px;scrollbar-width:none}
.cal-sum::-webkit-scrollbar{display:none}
.cal-sum .s{
  flex:1 0 auto;background:var(--card);border-radius:13px;box-shadow:var(--shadow);
  padding:9px 10px;min-width:0;text-align:left;
}
.cal-sum .s .t{font-size:.64rem;color:var(--faint);font-weight:600;white-space:nowrap}
.cal-sum .s .v{font-size:.98rem;font-weight:800;margin-top:2px;white-space:nowrap;letter-spacing:-.3px}
.cal-sum .s .v small{font-size:.7rem;font-weight:700;color:var(--faint);margin-left:2px}
.cal-sum .s.pf .v{color:var(--accent-dark)}
[data-theme="dark"] .cal-sum .s.pf .v{color:var(--accent)}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:12px;font-size:.66rem;color:var(--faint);font-weight:600}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:5px;height:5px;border-radius:99px;flex:none}
.cal-legend i.sq{width:8px;height:8px;border-radius:2px;border:1px solid}
.cal-legend i.bar{width:14px;height:3px;background:var(--line);overflow:hidden}
.cal-legend i.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.cal-tip{font-size:.66rem;color:var(--faint);margin-top:7px}
/* 선택일 상세 헤더 */
.cal-detail-date{
  display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;margin:18px 4px 10px;
}
.cal-detail-date .dd-when{flex:1;min-width:0}
.cal-detail-date .dd-sub{display:block;font-weight:600;font-size:.76rem;color:var(--sub);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-detail-date .dd-mood{font-size:1.25rem;flex:none}
/* 목록(아젠다) 뷰 */
.ag-day{display:flex;gap:11px;padding:12px 2px}
.ag-day+.ag-day{border-top:1px solid var(--line)}
.ag-day.is-today .ag-dnum{background:var(--accent);color:#fff}
.ag-when{flex:none;width:40px;text-align:center;padding-top:1px}
.ag-dnum{font-size:1.02rem;font-weight:800;width:30px;height:30px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;border-radius:99px;line-height:1}
.ag-dow{font-size:.66rem;font-weight:700;color:var(--faint);margin-top:3px}
.ag-day.sun .ag-dow,.ag-day.sun .ag-dnum:not(.on){color:#e0705f}
.ag-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ag-line{display:flex;align-items:center;gap:7px;font-size:.88rem;min-width:0}
.ag-line .dot{width:6px;height:6px;border-radius:99px;flex:none;background:var(--accent)}
.ag-line .dot.rt{background:var(--violet)}
.ag-line .dot.hi{background:var(--red)}
.ag-line .tm{font-size:.72rem;font-weight:700;color:var(--sub);flex:none;font-variant-numeric:tabular-nums}
.ag-line .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ag-line.ok .tx{color:var(--faint);text-decoration:line-through}
.ag-note{font-size:.78rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}

/* ---------- 목표 ---------- */
.goal-card{cursor:pointer}
.goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.goal-title{font-weight:700;font-size:1rem;word-break:break-word}
.goal-card.gdone .goal-title{color:var(--faint);text-decoration:line-through}
.dday{flex:none}
.goal-pct{display:flex;align-items:center;gap:10px;margin-top:9px}
.goal-pct .progress{flex:1}
.goal-pct b{font-size:.86rem;min-width:38px;text-align:right}
.goal-meta{margin-top:8px;font-size:.78rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:10px}
.ms-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.ms{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;
  background:var(--card2);font-size:.87rem;font-weight:500;text-align:left;
}
.ms .msq{
  flex:none;width:17px;height:17px;border-radius:6px;border:2px solid var(--faint);
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:.6rem;font-weight:900;
}
.ms.on .msq{background:var(--accent);border-color:var(--accent);color:#fff}
.ms.on{color:var(--faint);text-decoration:line-through}
.goal-sum{display:flex;align-items:center;gap:12px}
.goal-sum .gs-txt{font-size:.85rem;color:var(--sub)}
.goal-sum .gs-txt b{color:var(--text)}

/* ---------- 자산(포트폴리오) ---------- */
.pf-hero{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
  color:#fff;border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;
  box-shadow:0 6px 22px rgba(16,185,129,.28);
}
.pf-hero .pf-label{font-size:.82rem;opacity:.85;font-weight:600}
.pf-hero .pf-total{font-size:1.95rem;font-weight:800;letter-spacing:-.5px;margin-top:2px;line-height:1.15}
.pf-hero .pf-secondary{font-size:.78rem;opacity:.82;margin-top:4px;line-height:1.5}
.pf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.pf-stats .ps{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 10px}
.pf-stats .ps .k{font-size:.68rem;opacity:.85;font-weight:600}
.pf-stats .ps .v{font-size:.94rem;font-weight:800;margin-top:3px;white-space:nowrap}
.pf-goalbar{margin-top:14px}
.pf-goalbar .pg-head{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:600;margin-bottom:6px}
.pf-goalbar .pg-track{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.pf-goalbar .pg-fill{height:100%;border-radius:99px;background:#fff;transition:width .4s ease}
.pf-goalbar .pg-sub{font-size:.72rem;opacity:.85;margin-top:5px}
.pf-goalbar .pg-edit{color:#fff;text-decoration:underline;font-weight:700;font-size:.78rem;opacity:.95}
.pf-stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--card2)}
.pf-stack>span{height:100%}
.wbars{display:flex;flex-direction:column;gap:11px}
.wbar-row{display:flex;align-items:center;gap:10px}
.wbar-row .wdot{width:11px;height:11px;border-radius:4px;flex:none}
.wbar-row .wname{font-size:.86rem;font-weight:600;flex:none;width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar-row .wtrack{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.wbar-row .wtrack>div{height:100%;border-radius:99px;transition:width .4s ease}
.wbar-row .wpct{font-size:.8rem;font-weight:700;width:44px;text-align:right;flex:none}
.wbar-row .wval{font-size:.72rem;color:var(--sub);width:64px;text-align:right;flex:none}
.pf-div-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-div-box{background:var(--card2);border-radius:12px;padding:12px}
.pf-div-box .k{font-size:.72rem;color:var(--sub);font-weight:600}
.pf-div-box .v{font-size:1.12rem;font-weight:800;margin-top:4px}
.pf-div-box .s{font-size:.7rem;color:var(--faint);margin-top:3px}
.pf-note{font-size:.74rem;color:var(--faint);line-height:1.7;text-align:center;margin-top:2px}
/* 보유 종목 리스트 */
.hold-row{display:flex;align-items:center;gap:8px;padding:11px 0 12px;position:relative;cursor:pointer}
.hold-row+.hold-row,.hold-detail+.hold-row{border-top:1px solid var(--line)}
.h-icon{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.58rem;font-weight:800;letter-spacing:-.3px}
.h-main{flex:1;min-width:0}
.h-name{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:.7rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-val{text-align:right;flex:none;min-width:84px}
.h-val .now{font-size:.88rem;font-weight:800}
.h-val .sub{font-size:.68rem;color:var(--sub);margin-top:2px}
.h-wt{text-align:right;flex:none;min-width:62px}
.h-wt .pl{font-size:.84rem;font-weight:800}
.h-wt .pl2{font-size:.68rem;font-weight:700;margin-top:2px;opacity:.9}
.h-wt .up,.hold-detail .up{color:var(--red)}
.h-wt .down,.hold-detail .down{color:var(--blue)}
.hold-detail{background:var(--card2);border-radius:12px;padding:11px 13px;margin:0 0 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}
.hold-detail span{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;min-width:0}
.hold-detail i{font-style:normal;color:var(--sub);flex:none}
.hold-detail b{font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hold-sort{display:flex;gap:2px}
.hold-sort button{padding:6px 10px;font-size:.76rem;font-weight:600;color:var(--sub);border-radius:9px}
.hold-sort button.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
[data-theme="dark"] .hold-sort button.on{color:var(--accent)}
/* 배당 카드 */
.div-hero{padding:2px 2px 0}
.div-hero .k{font-size:.74rem;color:var(--sub);font-weight:600}
.div-hero .v{font-size:1.5rem;font-weight:800;letter-spacing:-.3px;margin-top:2px;color:var(--accent-dark)}
[data-theme="dark"] .div-hero .v{color:var(--accent)}
.div-hero .s{font-size:.72rem;color:var(--faint);margin-top:3px}
.sec-sub{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:17px 2px 8px;font-size:.85rem;font-weight:800}
.sec-sub span{font-size:.7rem;color:var(--sub);font-weight:600;text-align:right}
.div-cal{display:flex;align-items:flex-end;gap:3px;height:106px;padding-top:15px}
.div-cal .dc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0;cursor:pointer;border-radius:8px;padding:3px 0 2px}
.div-cal .dc b{font-size:.54rem;color:var(--sub);font-weight:700;white-space:nowrap}
.div-cal .dc i{width:100%;max-width:20px;border-radius:5px 5px 2px 2px;background:var(--accent-soft2)}
.div-cal .dc.cur i{background:var(--accent)}
.div-cal .dc span{font-size:.58rem;color:var(--faint);white-space:nowrap}
.div-cal .dc.cur span{color:var(--accent-dark);font-weight:800}
[data-theme="dark"] .div-cal .dc.cur span{color:var(--accent)}
.div-cal .dc.sel{background:var(--accent-soft)}
.div-cal .dc.sel span{color:var(--accent-dark);font-weight:800}
[data-theme="dark"] .div-cal .dc.sel span{color:var(--accent)}
.div-mdetail{background:var(--card2);border-radius:12px;padding:11px 13px 5px;margin-top:10px}
.div-mdetail .dm-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.84rem;font-weight:800;margin-bottom:3px}
.div-mdetail .dm-head span{font-size:.7rem;color:var(--sub);font-weight:600;text-align:right}
.dm-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.dm-row:last-child{border-bottom:none}
.dm-dot{flex:none;width:8px;height:8px;border-radius:99px}
.dm-row .dm-name{flex:none;max-width:45%;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-row .dm-sub{flex:1;font-size:.7rem;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-row .dm-val{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.dm-empty{font-size:.82rem;color:var(--sub);padding:4px 0 8px}
.dvgoal{background:var(--card2);border-radius:12px;padding:11px 13px;margin-top:15px;cursor:pointer}
.dvgoal .dg-head{display:flex;justify-content:space-between;align-items:center;font-size:.83rem;font-weight:700}
.dvgoal .dg-sub{font-size:.72rem;color:var(--sub);margin-top:6px}
.dvgoal-new{display:block;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:.85rem;border-radius:12px;padding:12px 13px;margin-top:15px}
[data-theme="dark"] .dvgoal-new{color:var(--accent)}
/* 자산 > 기록 */
.hx-chart{display:block;width:100%;height:auto;margin:2px 0 0;overflow:visible}
.hx-gapnote{font-size:.68rem;color:var(--faint);text-align:center;margin-top:2px}
.hx-rows{display:flex;flex-direction:column}
.hx-row{display:flex;align-items:center;gap:8px;padding:10px 0}
.hx-row+.hx-row{border-top:1px solid var(--line)}
.hx-row>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hx-row b{font-size:.86rem;font-weight:800;white-space:nowrap}
.hx-row i{font-style:normal;font-size:.68rem;color:var(--faint);white-space:nowrap}
/* 오른쪽 두 칸은 내용 폭에 맞춰지고(flex:none), 왼쪽 시점 칸이 남는 자리를 가져가요.
   위 .hx-row>div 의 min-width:0 이 더 강해서 여기에 min-width 를 줘도 먹지 않아요. */
.hx-when{flex:1}
.hx-amt{flex:none;text-align:right}
.hx-pl{flex:none;text-align:right}
.hx-pl sup{font-size:.7em}
.hx-row .up{color:var(--red)}
.hx-row .down{color:var(--blue)}
.hx-yb{cursor:pointer;border-radius:9px;padding:4px 6px}
.hx-yb.on{background:var(--accent-soft)}
.hx-yb .wname{width:52px;font-size:.82rem}
.hx-yb .wpct{width:78px;font-size:.78rem}
.hx-yb .wval{width:46px}
.hx-then-now{background:var(--card2);border-radius:12px;padding:11px 13px;margin-top:15px;font-size:.82rem;line-height:1.6}
.hx-then-now b{font-weight:800}
.hx-then-now i{display:block;font-style:normal;font-size:.72rem;color:var(--accent-dark);font-weight:700;margin-top:3px}
[data-theme="dark"] .hx-then-now i{color:var(--accent)}
.hx-snaphead .t{font-size:.82rem;color:var(--sub);font-weight:600}
.hx-snaphead .v{font-size:1.34rem;font-weight:800;letter-spacing:-.3px;margin-top:2px}
.hx-snaphead .s{font-size:.7rem;color:var(--faint);margin-top:3px}
.hx-more{font-size:.72rem;color:var(--faint);margin-top:11px;text-align:center}
.hx-hrow .wname{width:56px}
.hx-hrow .wpct{width:48px}
.hx-hrow .wval{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-cmp{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
.hx-cmp-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.hx-cmp-row i{font-style:normal;flex:none;width:96px;font-size:.72rem;color:var(--sub);font-weight:700;padding-top:3px}
.hx-cmp-row>div{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.hx-chip{font-size:.68rem;font-weight:700;padding:3px 7px;border-radius:7px}
.hx-chip.out{background:var(--card2);color:var(--sub);text-decoration:line-through}
.hx-chip.in{background:var(--accent-soft);color:var(--accent-dark)}
[data-theme="dark"] .hx-chip.in{color:var(--accent)}
.hx-none{font-size:.72rem;color:var(--faint);padding-top:3px}
.hx-keep{font-size:.72rem;color:var(--faint);font-weight:600}

/* ---------- 오늘의 명언 ---------- */
.quote-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;margin-bottom:14px;border-left:3px solid var(--amber);cursor:pointer}
.quote-card .q-txt{font-size:.87rem;line-height:1.65;word-break:keep-all}
.quote-card .q-author{margin-top:5px;font-size:.74rem;color:var(--faint);font-weight:700;text-align:right}

/* ---------- 오늘의 영어 ---------- */
.en-card{border-left:3px solid var(--violet)}
.en-list{display:flex;flex-direction:column;margin-top:-4px}
.en-w{display:block;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--line)}
.en-w:first-child{border-top:none}
.en-top{display:flex;align-items:baseline;gap:7px}
.en-top b{font-size:.94rem;font-weight:800}
.en-top i{font-style:normal;font-size:.66rem;color:var(--faint);font-weight:700;flex:none}
.en-top span{flex:1;text-align:right;font-size:.82rem;color:var(--sub);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en-ex{display:none;padding:8px 0 2px;font-size:.79rem;line-height:1.65;color:var(--faint)}
.en-w.open .en-ex{display:block}
.en-ex em{font-style:normal;display:block;color:var(--sub);font-weight:600;margin-bottom:2px}
.en-ph{margin-top:12px;padding:12px 13px;border-radius:12px;background:var(--card2)}
.en-ph .ep-e{font-size:.9rem;font-weight:700;line-height:1.55;word-break:break-word}
.en-ph .ep-k{margin-top:4px;font-size:.83rem;color:var(--sub)}
.en-ph .ep-n{margin-top:7px;font-size:.72rem;color:var(--faint);line-height:1.55}

/* ---------- 오늘의 칼로리 (섭취 vs 소비) ---------- */
.kcal-nums{display:flex;gap:8px}
.kcal-b{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:var(--card2)}
.kcal-b b{display:block;font-size:1rem;font-weight:800}
.kcal-b span{font-size:.67rem;color:var(--faint);font-weight:700}
.kcal-b.net b{color:var(--accent-dark)}
[data-theme="dark"] .kcal-b.net b{color:var(--accent)}
.kcal-b.net.over b,[data-theme="dark"] .kcal-b.net.over b{color:var(--red)}
.kcal-note{margin-top:9px;font-size:.7rem;color:var(--faint);line-height:1.55}

/* ---------- 식단 칼로리 자동 계산 ---------- */
.meal-line{display:flex;gap:7px}
.meal-line .lf-meal{flex:1;min-width:0}
.meal-line .lf-kcal{flex:0 0 78px;text-align:right}
.mk-hint{margin-top:5px;font-size:.72rem;color:var(--faint);line-height:1.7}
.mk-hint .miss{color:var(--amber);font-weight:700}
.mk-add{margin-left:4px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);font-size:.68rem;font-weight:800}
.mk-total{text-align:right;font-size:.88rem;font-weight:800;margin:-4px 0 14px}
.mk-total span{font-size:.74rem;color:var(--faint);font-weight:600}

/* ---------- 애플워치·피트니스 가져오기 ---------- */
.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.fit-grid .field{margin-bottom:0}
.fit-btns{display:flex;gap:8px;margin-bottom:12px}
.fit-btns .btn{flex:1;min-width:0}
.guide-ol{font-size:.85rem;color:var(--sub);line-height:1.9;word-break:keep-all}
.guide-ol b{color:var(--text)}
.guide-ol .step{margin-top:13px}
.guide-pre{
  background:var(--card2);border-radius:11px;padding:11px 12px;margin:9px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.74rem;line-height:1.75;white-space:pre-wrap;word-break:break-all;color:var(--text);
}

/* ---------- 주간 리포트 ---------- */
.wr-line{font-size:.85rem;color:var(--sub);padding:9px 2px;line-height:1.6}
.wr-line+.wr-line{border-top:1px solid var(--line)}
.wr-line b{color:var(--text)}

/* ---------- 통계 ---------- */
.stat-big{display:flex;align-items:center;gap:18px}
.stat-big .nums{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-big .nb b{display:block;font-size:1.14rem;font-weight:800}
.stat-big .nb span{font-size:.72rem;color:var(--sub)}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat-months{display:flex;font-size:.64rem;color:var(--faint);margin-bottom:3px}
.heatmap{display:grid;grid-auto-flow:column;gap:2.5px}
.heat-col{display:grid;grid-template-rows:repeat(7,1fr);gap:2.5px}
.heat-cell{width:10.5px;height:10.5px;border-radius:3px;background:var(--heat0)}
.heat-cell.h1{background:var(--heat1)}
.heat-cell.h2{background:var(--heat2)}
.heat-cell.h3{background:var(--heat3)}
.heat-cell.h4{background:var(--heat4)}
.heat-cell.future{background:transparent;border:1px dashed var(--line)}
.heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:7px;font-size:.68rem;color:var(--faint)}
.heat-legend .heat-cell{width:9px;height:9px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .bv{font-size:.6rem;color:var(--faint);font-weight:700}
.bar .bi{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--accent-soft2);position:relative;transition:height .3s}
.bar.cur .bi{background:var(--accent)}
.bar .bl{font-size:.6rem;color:var(--faint)}
.rt-row{display:flex;align-items:center;gap:11px;padding:9px 2px}
.rt-row+.rt-row{border-top:1px solid var(--line)}
.rt-row .rt-name{flex:1;min-width:0;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-row .progress{width:74px;flex:none}
.rt-row .rt-pct{font-size:.78rem;font-weight:700;width:36px;text-align:right;flex:none}
.rt-row .rt-streak{font-size:.75rem;color:var(--sub);flex:none;width:74px;text-align:right}

/* ---------- 설정 ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .sl{font-size:.92rem;font-weight:600}
.set-row .sd{font-size:.76rem;color:var(--sub);margin-top:2px}
.set-row .seg{flex:none}
.set-row input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;width:130px;text-align:right;background:var(--card);font-size:16px}
.set-row input[type=text]:focus{outline:none;border-color:var(--accent)}

/* ---------- FAB ---------- */
#fab{
  position:fixed;right:18px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);z-index:40;
  width:56px;height:56px;border-radius:19px;background:var(--accent);color:#fff;
  font-size:1.9rem;font-weight:300;line-height:1;box-shadow:0 6px 20px rgba(16,185,129,.4);
  display:flex;align-items:center;justify-content:center;padding-bottom:3px;
}
#fab:active{transform:scale(.93)}
#fab.hide{display:none}
@media (min-width:960px){#fab{right:calc(50vw - 430px - 70px + 106px);bottom:34px}}
@media (min-width:960px) and (max-width:1200px){#fab{right:40px}}

/* ---------- 모달 ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(15,20,25,.45);animation:fadein .15s}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:22px 22px 0 0;max-height:90dvh;overflow-y:auto;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:640px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:500px;border-radius:22px;max-height:86vh;animation:pop .18s ease}
  @keyframes pop{from{transform:translate(-50%,-48%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
@media (min-width:640px){.grip{visibility:hidden;margin:2px auto 6px}}
.m-title{font-size:1.12rem;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.m-title .btn-sm{font-weight:600}
.field{margin-bottom:15px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--sub);margin-bottom:6px}
.input{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:16px;background:var(--card);
}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{resize:vertical;min-height:64px}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.day-picks{display:flex;gap:5px}
.day-pick{
  flex:1;padding:9px 0;border-radius:10px;background:var(--card2);

<script>
'use strict';
/* ============================================================
   동건루틴 v1.0 — 할 일 · 루틴 · 목표 · 통계 · 공유
   데이터는 이 기기(localStorage)에만 저장됩니다.
   ============================================================ */
const APP_VERSION = '1.11.0';
const LS_KEY = 'dgr_data';
const MOODS = ['😄','🙂','😐','😕','😢'];
const KD = ['일','월','화','수','목','금','토'];
const PRI = ['낮음','보통','높음'];
const TYPE_NAME = { month:'월간', quarter:'분기', year:'연간' };

/* ---------- 유틸 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9));
const vib = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => fmtDate(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const dow = s => parseDate(s).getDay();
const fmtKo = s => { const d = parseDate(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${KD[d.getDay()]}요일`; };
const fmtKoShort = s => { const d = parseDate(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

function weekDates(s) {
  const ws = S.settings.weekStart;
  const off = (dow(s) - ws + 7) % 7;
  const start = addDays(s, -off);
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}
function* dateRange(a, b) { let d = a; while (d <= b) { yield d; d = addDays(d, 1); } }

/* ---------- 기간(월/분기/연) ---------- */
const monthKeyOf = s => s.slice(0, 7);
const quarterKeyOf = s => `${s.slice(0, 4)}-Q${Math.floor((+s.slice(5, 7) - 1) / 3) + 1}`;
const yearKeyOf = s => s.slice(0, 4);
const curKey = type => ({ month: monthKeyOf(todayStr()), quarter: quarterKeyOf(todayStr()), year: yearKeyOf(todayStr()) }[type]);

function periodRange(type, key) {
  if (type === 'month') {
    const [y, m] = key.split('-').map(Number);
    return { start: `${y}-${pad(m)}-01`, end: fmtDate(new Date(y, m, 0)) };
  }
  if (type === 'quarter') {
    const y = +key.slice(0, 4), q = +key.slice(6);
    const m1 = (q - 1) * 3 + 1;
    return { start: `${y}-${pad(m1)}-01`, end: fmtDate(new Date(y, m1 + 2, 0)) };
  }
  return { start: `${key}-01-01`, end: `${key}-12-31` };
}
function periodLabel(type, key) {
  if (type === 'month') { const [y, m] = key.split('-'); return `${y}년 ${+m}월`; }
  if (type === 'quarter') return `${key.slice(0, 4)}년 ${key.slice(6)}분기`;
  return `${key}년`;
}
function periodShift(type, key, delta) {
  if (type === 'month') { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  if (type === 'quarter') { let y = +key.slice(0, 4), q = +key.slice(6) + delta; while (q > 4) { q -= 4; y++; } while (q < 1) { q += 4; y--; } return `${y}-Q${q}`; }
  return String(+key + delta);
}
function ddayLabel(type, key) {
  const { start, end } = periodRange(type, key);
  const t = todayStr();
  if (t > end) return { txt: '기간 종료', cls: '' };
  if (t < start) return { txt: `시작 D-${diffDays(t, start)}`, cls: '' };
  const n = diffDays(t, end);
  return { txt: n === 0 ? 'D-DAY' : `D-${n}`, cls: n <= 7 ? 'red' : 'accent' };
}

/* ---------- 저장소 ---------- */
const DEFAULT_DATA = () => ({
  version: 1,
  meta: { firstUse: todayStr() },
  settings: { theme: 'auto', weekStart: 0, name: '동건', lastBackup: null },
  todos: [],
  routines: [],
  routineLog: {},
  goals: [],
  reflections: {},
  trackers: [],
  trackerLog: {},
  lifeLog: {},
  memos: [],
  trash: [],
  foodDB: []          // 기본 표에 없어서 직접 등록한 음식 [{n, k, u}]
});
let S = DEFAULT_DATA();

/* 저장된 데이터에 '새로 생긴 기본값'을 채워 넣어요.
   최상위만 합치면(Object.assign) settings·meta가 통째로 교체돼서
   나중에 추가한 하위 항목이 기존 사용자에게 전달되지 않아요. */
function fillDefaults(saved, defaults) {
  if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return saved;
  for (const k of Object.keys(defaults)) {
    const dv = defaults[k];
    if (!(k in saved) || saved[k] == null) saved[k] = dv;
    else if (dv && typeof dv === 'object' && !Array.isArray(dv)) fillDefaults(saved[k], dv);
  }
  return saved;
}
function parseSaved(raw) {
  const d = JSON.parse(raw);
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('bad shape');
  return fillDefaults(d, DEFAULT_DATA());
}
function load() {
  const raw = (() => { try { return localStorage.getItem(LS_KEY); } catch (e) { return null; } })();
  if (raw) {
    try { S = parseSaved(raw); return; } catch (e) {}
  }
  // 본 데이터가 깨졌거나 아예 사라진 경우 모두 보조 백업을 시도해요
  try {
    const bak = localStorage.getItem(LS_KEY + '_bak');
    if (bak) {
      S = parseSaved(bak);
      setTimeout(() => toast('백업 데이터에서 복구했어요'), 1400);
      return;
    }
  } catch (e) {}
  S = DEFAULT_DATA();
}
function save() {
  // 오늘 첫 저장이면 '덮어쓰기 전' 상태를 미리 챙겨둬요
  let bakDue = false, prev = null;
  try {
    bakDue = localStorage.getItem(LS_KEY + '_bakday') !== todayStr();
    if (bakDue) prev = localStorage.getItem(LS_KEY);
  } catch (e) { bakDue = false; }
  try {
    if (!applyingRemote) S.meta.updatedAt = new Date().toISOString();
    // 본 저장이 항상 먼저 — 보조 백업(용량 2배) 때문에 본 저장이 실패하면 안 돼요
    localStorage.setItem(LS_KEY, JSON.stringify(S));
    queuePush();
  } catch (e) {
    toast('⚠️ 저장 공간이 부족해요 — 백업 내보내기로 지켜주세요');
    return;
  }
  if (bakDue) dailyBackup(prev);
}
// 하루 1회 보조 백업. 실패해도 본 저장에는 영향이 없어요.
function dailyBackup(prev) {

const routinesFor = d => S.routines.filter(r => routineOn(r, d));

function toggleRoutineLog(id, d) {
  const arr = S.routineLog[d] || (S.routineLog[d] = []);
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else { arr.push(id); vib(); }
  if (!arr.length) delete S.routineLog[d];
}

function dayStats(d) {
  const ts = todosOf(d), rs = routinesFor(d);
  const doneT = ts.filter(t => t.done).length;
  const doneR = rs.filter(r => isRDone(r.id, d)).length;
  return { total: ts.length + rs.length, done: doneT + doneR };
}
function rangeStats(start, end) {
  const e = end > todayStr() ? todayStr() : end;
  let total = 0, done = 0, activeDays = 0, reflDays = 0;
  if (start > e) return { total, done, activeDays, reflDays, rate: 0 };
  for (const d of dateRange(start, e)) {
    const s = dayStats(d);
    total += s.total; done += s.done;
    if (s.done > 0) activeDays++;
    if (S.reflections[d]) reflDays++;
  }
  return { total, done, activeDays, reflDays, rate: total ? Math.round(done / total * 100) : 0 };
}
function rCurStreak(r) {
  let d = todayStr(), n = 0;
  if (r.days.includes(dow(d)) && !isRDone(r.id, d)) d = addDays(d, -1); // 오늘 아직 안 했으면 어제부터
  const limit = r.startDate || '2000-01-01';
  for (let i = 0; i < 3700 && d >= limit; i++) {
    if (r.days.includes(dow(d))) { if (isRDone(r.id, d)) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}
function rBestStreak(r) {
  // 시작일 이전 기록과, 나중에 요일을 바꿔서 '예정일이 아니게 된' 날은 세지 않아요
  const limit = r.startDate || '2000-01-01';
  const dates = Object.keys(S.routineLog)
    .filter(d => d >= limit && r.days.includes(dow(d)) && isRDone(r.id, d)).sort();
  if (!dates.length) return 0;
  let best = 0, cur = 0, prev = null;
  for (const d of dates) {
    if (prev) {
      // 사이에 '스케줄된 날'을 건너뛰었으면 스트릭 끊김
      let ok = true;
      for (const m of dateRange(addDays(prev, 1), addDays(d, -1))) { if (r.days.includes(dow(m))) { ok = false; break; } }
      cur = ok ? cur + 1 : 1;
    } else cur = 1;
    best = Math.max(best, cur); prev = d;
  }
  return best;
}
function rRate(r, days) {
  let total = 0, done = 0;
  const from = addDays(todayStr(), -(days - 1));
  for (const d of dateRange(from, todayStr())) {
    if (routineOn(r, d)) { total++; if (isRDone(r.id, d)) done++; }
  }
  return { total, done, rate: total ? Math.round(done / total * 100) : 0 };
}

const clamp01 = x => Math.max(0, Math.min(1, x));
const parseNum = v => { if (v == null) return null; const s = String(v).trim(); if (s === '') return null; const n = parseFloat(s); return isNaN(n) ? null : n; };
const hasMetric = g => g.metric && g.metric.target != null && g.metric.target !== '';
function metricProg(m) {
  if (!m || m.target == null || m.target === '') return 0;
  const t = +m.target;
  const rawCur = metricCur(m);   // 포트폴리오 연동이면 실시간 값
  if (m.dir === 'down') {
    const s = (m.start == null || m.start === '') ? t : +m.start;   // 시작값 없으면 목표=시작으로 간주
    const cur = (rawCur == null || rawCur === '') ? s : +rawCur;
    if (s <= t) return cur <= t ? 100 : 0;
    return Math.round(clamp01((s - cur) / (s - t)) * 100);
  }
  const base = (m.start == null || m.start === '') ? 0 : +m.start;
  const cur = (rawCur == null || rawCur === '') ? base : +rawCur;
  if (t <= base) return cur >= t ? 100 : 0;
  return Math.round(clamp01((cur - base) / (t - base)) * 100);
}
function metricSummary(m) {
  const u = m.unit ? ' ' + esc(m.unit) : '';
  const t = +m.target, p = metricProg(m), done = p >= 100;
  const rc = metricCur(m);   // 포트폴리오 연동이면 실시간 값
  if (m.dir === 'down') {
    const cur = rc, s = m.start;
    const remain = cur != null && cur !== '' ? Math.max(0, Math.round((+cur - t) * 100) / 100) : null;
    const line = `${s != null && s !== '' ? `시작 ${fmtNum(s)} · ` : ''}현재 ${cur != null && cur !== '' ? `<b>${fmtNum(cur)}</b>` : '—'} → 목표 <b>${fmtNum(t)}</b>${u}` +
      (remain != null ? (done ? ` · <span class="done">목표 달성! 🎉</span>` : ` · <b>${fmtNum(remain)}${u}</b> 남음`) : '');
    return { line, p, done };
  }
  const c = rc != null && rc !== '' ? +rc : 0;
  const remain = Math.max(0, Math.round((t - c) * 100) / 100);
  const line = `<b>${fmtNum(c)}</b> / <b>${fmtNum(t)}</b>${u}` +
    (done ? ` · <span class="done">목표 달성! 🎉</span>` : ` · <b>${fmtNum(remain)}${u}</b> 남음`);
  return { line, p, done };
}

}

function monthlyDividendsUSD() {
  const out = Array(12).fill(0);
  PF_SNAPSHOT.holdings.forEach(h => {
    const annual = h.sh * h.div;
    if (annual <= 0) return;
    const months = payMonthsOf(h);

  });

function computePortfolio() {
  const s = PF_SNAPSHOT;
  let stock = 0, cost = 0, div = 0;
  const secMap = {};
  s.holdings.forEach(h => {
    const v = h.sh * h.pr, c = h.sh * h.ac, d = h.sh * h.div;
    stock += v; cost += c; div += d;
    secMap[h.sec] = (secMap[h.sec] || 0) + v;
  });
  const total = stock + s.cashUSD;
  const sectors = Object.entries(secMap)
    .map(([name, value]) => ({ name, value, weight: stock > 0 ? value / stock * 100 : 0, color: PF_SECTOR_COLORS[name] || '#94a3b8' }))
    .sort((a, b) => b.value - a.value);
  // 종목별 상세 (현재가·평단·비중·손익·배당)
  const holdings = s.holdings.map(h => {
    const value = h.sh * h.pr, hcost = h.sh * h.ac, pl = value - hcost, annualDiv = h.sh * h.div;
    return {
      t: h.t, name: h.name, sec: h.sec, sh: h.sh, pm: h.pm,
      price: h.pr, avgCost: h.ac, value, cost: hcost, pl,
      plPct: hcost > 0 ? pl / hcost * 100 : 0,
      weight: stock > 0 ? value / stock * 100 : 0,
      annualDiv, currentYield: value > 0 ? annualDiv / value * 100 : 0,
      color: PF_SECTOR_COLORS[h.sec] || '#94a3b8'
    };
  }).sort((a, b) => b.value - a.value);
  return {
    fx: s.fx, taxRate: s.taxRate, asOf: s.asOf, priceDate: s.priceDate,
    stockUSD: stock, cashUSD: s.cashUSD, totalUSD: total,
    costUSD: cost, plUSD: stock - cost, plPct: cost > 0 ? (stock - cost) / cost * 100 : 0,
    divUSD: div, divAfterUSD: div * (1 - s.taxRate),
    yieldPct: stock > 0 ? div / stock * 100 : 0, yocPct: cost > 0 ? div / cost * 100 : 0,
    sectors, holdings
  };
}

function pfMoney(usd, cur) {
  if (cur === 'USD') return '$' + Math.round(usd).toLocaleString('en-US');
  return '₩' + Math.round(usd * PF_SNAPSHOT.fx).toLocaleString('en-US');
}
// 좁은 칸용 축약(억/만) 표기
function pfCompact(usd, cur) {
  if (cur === 'USD') return (usd < 0 ? '-$' : '$') + Math.round(Math.abs(usd)).toLocaleString('en-US');
  const krw = usd * PF_SNAPSHOT.fx, a = Math.abs(krw), sg = krw < 0 ? '-' : '';
  if (a >= 1e8) return `${sg}₩${(Math.round(a / 1e6) / 100).toLocaleString('en-US')}억`;
  return `${sg}₩${Math.round(a / 1e4).toLocaleString('en-US')}만`;
}
// USD 금액 → 목표 단위(만원/원/$) 숫자값
function pfToUnit(usd, unit) {
  const fx = PF_SNAPSHOT.fx;
  if (/만원/.test(unit)) return usd * fx / 10000;
  if (/원|₩/.test(unit)) return usd * fx;
  return usd;   // $ · 달러 · USD
}
// 목표 단위 숫자값 → USD (pfToUnit 역변환)
function pfUnitToUSD(val, unit) {
  const fx = PF_SNAPSHOT.fx;
  if (/만원/.test(unit)) return val * 10000 / fx;
  if (/원|₩/.test(unit)) return val / fx;
  return val;
}

function pfLinkUSD(link) {
  const pf = computePortfolio();
  return link === 'assets' ? pf.totalUSD

function metricCur(m) {
  if (m && m.link) {
    const usd = pfLinkUSD(m.link);

  }
  return m ? m.current : null;
}

// 그날의 영어 — 단어 10개(300개 = 30일 주기) + 표현 1개
function dailyEnglish(d) {
  const n = diffDays('2000-01-01', d);
  const wi = ((n * 10) % EN_WORDS.length + EN_WORDS.length) % EN_WORDS.length;
  const words = Array.from({ length: 10 }, (_, i) => EN_WORDS[(wi + i) % EN_WORDS.length]);
  const phrase = EN_PHRASES[((n % EN_PHRASES.length) + EN_PHRASES.length) % EN_PHRASES.length];
  return { words, phrase, set: Math.floor(wi / 10) + 1, sets: Math.ceil(EN_WORDS.length / 10) };
}

const trackerVal = (id, d) => (S.trackerLog[d] || {})[id];
function setTrackerVal(id, d, val) {
  const day = S.trackerLog[d] || (S.trackerLog[d] = {});
  if (val === '' || val == null) { delete day[id]; if (!Object.keys(day).length) delete S.trackerLog[d]; }
  else day[id] = val;
}
const fmtNum = n => String(Math.round(+n * 100) / 100);
function trackerEntries(tk, fromD, toD) {
  const out = [];
  for (const d in S.trackerLog) {
    if (d < fromD || d > toD) continue;
    const v = S.trackerLog[d][tk.id];
    if (v !== undefined) out.push({ d, v });
  }
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function lastTrackerEntry(tk) {
  let best = null;
  for (const d in S.trackerLog) {
    if (S.trackerLog[d][tk.id] !== undefined && (!best || d > best.d)) best = { d, v: S.trackerLog[d][tk.id] };
  }
  return best;
}
const trackerDayCount = tk => Object.keys(S.trackerLog).filter(d => S.trackerLog[d][tk.id] !== undefined).length;

/* 수량 파싱 — '2개', '두 공기', '1.5인분', '반 공기', '200g' 을 알아들어요 */
const KO_NUM = { 반: 0.5, 한: 1, 두: 2, 세: 3, 네: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열: 10 };
const QTY_UNIT_RE = /(\d+(?:\.\d+)?|반|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(개|인분|공기|그릇|잔|컵|조각|장|쪽|줄|캔|병|봉지|봉|판|마리|스푼|큰술|모|팩|통|접시|알|꼬치|스쿱|갑|토막)\s*$/;
const AMT_RE = /(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\s*$/i;
function splitQty(raw) {
  let s = String(raw).trim(), qty = 1, amt = null;
  let m = s.match(AMT_RE);
  if (m) {
    let v = parseFloat(m[1]);
    const u = m[2].toLowerCase();
    if (u === 'kg' || u === 'l') v *= 1000;
    amt = v;
    s = s.slice(0, m.index).trim();
  } else if ((m = s.match(QTY_UNIT_RE))) {
    qty = KO_NUM[m[1]] != null ? KO_NUM[m[1]] : parseFloat(m[1]);
    s = s.slice(0, m.index).trim();
  } else if ((m = s.match(/[x×*]?\s*(\d+(?:\.\d+)?)\s*$/)) && s.slice(0, m.index).trim().length >= 2) {
    qty = parseFloat(m[1]);
    s = s.slice(0, m.index).trim();
  }
  return { name: s, qty: qty > 0 ? qty : 1, amt };
}
const foodNorm = s => String(s ?? '').toLowerCase().replace(/[\s·,()\-_]/g, '');
const myFoods = () => (S.foodDB || []).map(f => ({ n: f.n, k: f.k, u: f.u || '1인분', my: true }));
// 이름(과 별칭)이 딱 맞는 것 — '김치 찌개'처럼 띄어 써도 붙여서 비교해요
function findFoodExact(name) {
  const q = foodNorm(name);
  if (!q) return null;
  for (const f of [...myFoods(), ...FOOD_DB]) {
    if (foodNorm(f.n) === q) return f;
    if (f.al && f.al.some(a => foodNorm(a) === q)) return f;
  }
  return null;
}
// 딱 맞는 게 없으면 가장 긴 부분 일치로 — '레드와인' → '와인', '비빔밥곱빼기' → '비빔밥'
function findFood(name) {
  const q = foodNorm(name);
  if (!q) return null;
  const ex = findFoodExact(name);
  if (ex) return ex;
  let best = null;
  for (const f of [...myFoods(), ...FOOD_DB]) {
    for (const c of [f.n, ...(f.al || [])].map(foodNorm)) {
      if (c.length < 2) continue;
      if (q.includes(c) || (q.length >= 2 && c.includes(q))) {
        if (!best || c.length > best.len) best = { f, len: c.length };
      }
    }
  }
  return best ? best.f : null;
}
function pushFood(f, qty, amt, out) {
  let mult = qty;
  if (amt != null) {   // 200g 처럼 무게로 적었으면 기준량(100g 등)으로 환산
    const base = (String(f.u).match(/(\d+)\s*(?:g|ml)/i) || [])[1];
    mult = base ? amt / +base : 1;
  }
  const k = Math.round(f.k * mult);
  out.kcal += k;
  out.hits.push({ n: f.n, k, my: !!f.my });
}
function matchFoodPiece(raw, out) {
  const { name, qty, amt } = splitQty(raw);
  const f = findFood(name || raw);
  if (!f) return false;
  pushFood(f, qty, amt, out);
  return true;
}
/* '계란후라이 2개, 우유' → { kcal, hits[], miss[] }
   한 조각을 볼 때 ① 이름이 딱 맞나 ② 띄어쓰기로 나누면 둘 이상 맞나 ③ 부분 일치 순으로 봐요.
   ①이 먼저라서 '김치 찌개'가 '김치'+'찌개'로 쪼개지지 않고, ②가 있어서 '계란후라이 우유'는 둘 다 잡혀요. */
function estimateKcal(text) {
  const out = { kcal: 0, hits: [], miss: [] };
  if (!text) return out;
  String(text).split(/[,،、·+/\n]+/).map(s => s.trim()).filter(Boolean).forEach(tok => {
    const { name, qty, amt } = splitQty(tok);
    const exact = findFoodExact(name || tok);
    if (exact) { pushFood(exact, qty, amt, out); return; }

    const parts = tok.split(/\s+/).filter(Boolean);
    if (parts.length > 1) {
      const trial = { kcal: 0, hits: [], miss: [] };
      let ok = 0;
      parts.forEach(p => { if (matchFoodPiece(p, trial)) ok++; });
      if (ok >= 2) { out.kcal += trial.kcal; out.hits.push(...trial.hits); return; }
    }
    if (matchFoodPiece(tok, out)) return;
    if (parts.length > 1) {
      const before = out.hits.length;
      parts.forEach(p => matchFoodPiece(p, out));
      if (out.hits.length > before) return;
    }
    out.miss.push(name || tok);
  });
  out.kcal = Math.round(out.kcal);
  return out;
}

/* ---------- 라이프로그(식단·운동·독서·활동) ----------
   S.lifeLog[날짜] = { meal:{b,l,d,s, kc:{b,l,d,s}}, workout:[{n,a,k}], read:[{b,a}],
                       fit:{act,rest,ex,stand,steps,wk:[{n,min,kcal}],at,src} } */
const LIFE_MEALS = [['b', '아침'], ['l', '점심'], ['d', '저녁'], ['s', '간식']];
const LIFE_KINDS = {
  meal:    { emoji: '🍽️', name: '식단', hint: '오늘 뭘 먹었나요?',    done: '식단을 기록했어요 🍽️' },
  workout: { emoji: '💪', name: '운동', hint: '뭘 얼마나 했나요?',    done: '운동을 기록했어요 💪' },
  read:    { emoji: '📖', name: '독서', hint: '어떤 책을 읽었나요?',  done: '독서를 기록했어요 📖' },
  fit:     { emoji: '⌚', name: '활동', hint: '애플워치 기록을 가져와요', done: '활동을 기록했어요 ⌚' }
};
const LIFE_ORDER = ['meal', 'workout', 'read', 'fit'];
const lifeOf = d => S.lifeLog[d] || {};
function setLife(d, key, val) {
  const day = S.lifeLog[d] || (S.lifeLog[d] = {});
  if (val == null) delete day[key]; else day[key] = val;
  if (!Object.keys(day).length) delete S.lifeLog[d];
}
const lifeKcal = w => (w || []).reduce((a, x) => a + (+x.k || 0), 0);
/* 섭취 칼로리 합계 — 저장된 값(kc)이 있으면 그걸 쓰고, 없으면 적어 둔 음식으로 어림해요.
   덕분에 예전에 남긴 식단 기록도 다시 열어 볼 필요 없이 칼로리가 보여요.
   kc[k] === 0 은 '일부러 비워 둔 끼니'라는 뜻이라 어림 계산을 하지 않습니다. */
const mealKcal = m => !m ? 0 : LIFE_MEALS.reduce((a, [k]) => {
  if (!m[k]) return a;
  const saved = (m.kc || {})[k];
  return a + (saved != null ? (+saved || 0) : estimateKcal(m[k]).kcal);
}, 0);
const hasFit = f => !!f && !!(f.act || f.rest || f.ex || f.stand || f.steps || (f.wk && f.wk.length));
const fitDayCount = () => Object.keys(S.lifeLog).filter(d => hasFit(S.lifeLog[d].fit)).length;
/* 그날의 에너지 한눈에 — 섭취(식단) vs 소비(활동/운동)
   애플워치 활동 에너지는 운동까지 포함한 값이라, 워치 기록이 있으면 그걸 우선 씁니다. */
function dayEnergy(d) {
  const L = lifeOf(d), f = L.fit || null;
  const eaten = mealKcal(L.meal);
  const manual = lifeKcal(L.workout);
  const act = f && f.act ? +f.act : manual;
  const rest = f && f.rest ? +f.rest : 0;
  return {
    eaten, act, rest, burn: act + rest, net: eaten - (act + rest),
    fromWatch: !!(f && f.act), has: eaten > 0 || act > 0 || rest > 0
  };
}
function lifeSummary(kind, d) {   // 목록 행에 보여줄 한 줄 요약 (없으면 null)
  const L = lifeOf(d);
  if (kind === 'meal') {
    const m = L.meal; if (!m) return null;
    return LIFE_MEALS.filter(([k]) => m[k]).map(([k, label]) => `${label} ${m[k]}`).join(' · ');
  }
  if (kind === 'workout') {
    const w = L.workout; if (!w || !w.length) return null;
    return w.map(x => x.n + (x.a ? ' ' + x.a : '')).join(' · ');
  }
  if (kind === 'fit') {
    const f = L.fit; if (!hasFit(f)) return null;
    const parts = [];
    if (f.act) parts.push(`활동 ${fmtNum(f.act)}kcal`);
    if (f.ex) parts.push(`운동 ${fmtNum(f.ex)}분`);
    if (f.steps) parts.push(`${(+f.steps).toLocaleString()}걸음`);
    if (f.wk && f.wk.length) parts.push(f.wk.map(x => x.n).filter(Boolean).join(', '));
    return parts.join(' · ');
  }
  const r = L.read; if (!r || !r.length) return null;
  return r.map(x => x.b + (x.a ? ' (' + x.a + ')' : '')).join(' · ');
}

/* ---------- 메모장 · 날짜별 글 ----------
   S.memos = [{id, text, pinned, date?, createdAt, updatedAt}] — 첫 줄이 제목
   date가 있으면 '그 날의 글'로 달력에 함께 보여요 (없으면 날짜 없는 자유 메모) */
const memoById = id => S.memos.find(m => m.id === id);
const memoTitle = m => (m.text.split('\n')[0] || '').trim() || '제목 없음';
const memoBody = m => m.text.split('\n').slice(1).join(' ').trim();
function sortedMemos() {
  return [...S.memos].sort((a, b) =>
    (!!b.pinned - !!a.pinned) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
}
// 그 날짜에 쓴 글 (오래된 순)

let toastTimer = null, toastUndo = null;
// toast('지웠어요', { undo: fn }) 처럼 부르면 6초간 '되돌리기' 버튼이 함께 떠요
function toast(msg, opts) {
  const t = $('#toast');
  const undo = opts && opts.undo;
  toastUndo = undo || null;
  if (undo) {
    t.innerHTML = `<span class="t-msg"></span><button class="t-undo" data-action="toast-undo">되돌리기</button>`;
    t.querySelector('.t-msg').textContent = msg;
    t.classList.add('has-undo');
  } else {
    t.textContent = msg;
    t.classList.remove('has-undo');
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 2200);
}
function hideToast() {
  const t = $('#toast');
  t.classList.remove('show', 'has-undo');
  toastUndo = null;
}

let modalDismiss = null, modalPrevFocus = null;
// onDismiss: 배경 클릭·Esc처럼 '버튼을 누르지 않고' 닫혔을 때 불려요.
// 이게 없으면 await confirmDlg(...) 같은 코드가 영원히 기다린 채 멈춥니다.
function openModal(html, onDismiss) {
  const root = $('#modal-root');
  const pending = modalDismiss;                          // 이전 모달이 대기 중이면 먼저 정리
  modalDismiss = onDismiss || null;
  if (!root.classList.contains('open')) modalPrevFocus = document.activeElement;
  root.innerHTML = `<div class="overlay" data-action="close-modal"></div>` +
    `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grip"></div>${html}</div>`;
  root.classList.add('open');
  document.body.style.overflow = 'hidden';
  const sheet = root.querySelector('.sheet');
  if (sheet) sheet.focus({ preventScroll: true });
  if (pending) pending();
}
function closeModal() {
  const root = $('#modal-root');
  const dismiss = modalDismiss;
  modalDismiss = null;
  root.classList.remove('open');
  root.innerHTML = '';
  document.body.style.overflow = '';
  const back = modalPrevFocus;
  modalPrevFocus = null;
  if (back && back.focus && document.contains(back)) { try { back.focus({ preventScroll: true }); } catch (e) {} }
  if (dismiss) dismiss();
}
const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
document.addEventListener('keydown', e => {
  const root = $('#modal-root');
  if (!root.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  // 모달 안에서 Tab이 뒤 화면으로 빠져나가지 않게
  const items = [...root.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
});
function confirmDlg(title, msg, { danger = false, ok = '확인' } = {}) {
  return new Promise(res => {
    openModal(`
      <div class="m-title">${esc(title)}</div>
      <p style="color:var(--sub);font-size:.92rem;margin:-6px 0 4px;white-space:pre-line">${esc(msg)}</p>
      <div class="m-actions">
        <button class="btn" id="cf-no">취소</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-ok" style="flex:1">${esc(ok)}</button>
      </div>`, () => res(false));                        // 배경 클릭·Esc = 취소
    const done = v => { modalDismiss = null; closeModal(); res(v); };
    $('#cf-no').onclick = () => done(false);
    $('#cf-ok').onclick = () => done(true);
  });
}

/* ---------- 되돌리기 · 휴지통 ---------- */
const TRASH_KEEP_DAYS = 30, TRASH_MAX = 100;
const TRASH_TYPE = { todo: '할 일', memo: '메모', routine: '루틴', tracker: '기록 항목', goal: '목표' };

// 삭제 직전 상태를 떠 놓았다가 '되돌리기'에서 그대로 되돌려요
function snapshotOf(keys) {
  const snap = {};
  for (const k of [...keys, 'trash']) snap[k] = JSON.parse(JSON.stringify(S[k] ?? null));
  return snap;
}
function restoreSnapshot(snap) {
  for (const k of Object.keys(snap)) if (snap[k] !== null) S[k] = snap[k];
  save(); render();
}
function trashPush(type, data) {
  if (!Array.isArray(S.trash)) S.trash = [];
  S.trash.unshift({ id: uid(), type, deletedAt: new Date().toISOString(), data });
  if (S.trash.length > TRASH_MAX) S.trash.length = TRASH_MAX;
}
// 삭제 → 휴지통 보관 → 6초간 되돌리기 토스트
function deleteWithUndo({ keys, type, data, del, msg }) {
  const snap = snapshotOf(keys);
  const keep = JSON.parse(JSON.stringify(data));         // 삭제 전에 미리 복사해 둬요
  del();
  trashPush(type, keep);
  save(); render();
  toast(msg, { undo: () => { restoreSnapshot(snap); toast('되돌렸어요 ↩️'); } });
}
// 30일 지난 항목 정리 (앱 시작 시 1회)
function trashSweep() {
  if (!Array.isArray(S.trash) || !S.trash.length) return;
  const cut = addDays(todayStr(), -TRASH_KEEP_DAYS);
  const before = S.trash.length;
  S.trash = S.trash.filter(x => (x.deletedAt || '').slice(0, 10) >= cut);
  if (S.trash.length > TRASH_MAX) S.trash.length = TRASH_MAX;
  if (S.trash.length !== before) save();
}
function trashTitle(e) {
  const it = (e.data || {}).item || {};
  return it.title || it.name || (e.type === 'memo' && it.text ? memoTitle(it) : '') || '(제목 없음)';
}
function trashRestore(id) {
  const i = (S.trash || []).findIndex(x => x.id === id);
  if (i < 0) return;
  const e = S.trash[i], d = e.data || {}, it = d.item;
  if (!it) { S.trash.splice(i, 1); save(); render(); return; }
  switch (e.type) {
    case 'todo':
      if (!S.todos.some(x => x.id === it.id)) S.todos.push(it);
      break;
    case 'memo':
      if (!S.memos.some(x => x.id === it.id)) S.memos.push(it);
      break;
    case 'routine':
      if (!S.routines.some(x => x.id === it.id)) S.routines.push(it);
      for (const dt of (d.logDates || [])) {
        const arr = S.routineLog[dt] || (S.routineLog[dt] = []);
        if (!arr.includes(it.id)) arr.push(it.id);
      }
      break;
    case 'tracker':
      if (!S.trackers.some(x => x.id === it.id)) S.trackers.push(it);
      for (const [dt, v] of Object.entries(d.log || {})) {
        (S.trackerLog[dt] || (S.trackerLog[dt] = {}))[it.id] = v;
      }
      break;
    case 'goal':
      if (!S.goals.some(x => x.id === it.id)) S.goals.push(it);
      for (const tid of (d.todoIds || [])) {
        const t = S.todos.find(x => x.id === tid);
        if (t && !t.goalId) t.goalId = it.id;
      }
      break;
  }
  S.trash.splice(i, 1);
  save(); render();
  toast('복원했어요 ♻️');
}
function trashModal() {
  const list = S.trash || [];
  openModal(`
    <div class="m-title">🗑️ 휴지통</div>
    <p style="color:var(--sub);font-size:.86rem;margin:-6px 0 12px">삭제한 항목을 ${TRASH_KEEP_DAYS}일간 보관해요. 최대 ${TRASH_MAX}개까지 남고, 오래된 것부터 사라져요.</p>
    ${!list.length ? '<div class="empty">휴지통이 비어 있어요</div>' : `
      <div class="search-res">${list.map(e => `
        <div class="set-row">
          <div><div class="sl">${TRASH_TYPE[e.type] || '항목'} · ${esc(trashTitle(e))}</div>
            <div class="sd">${(e.deletedAt || '').slice(0, 10)} 삭제</div></div>
          <button class="btn btn-sm" data-action="trash-restore" data-id="${e.id}">복원</button>

  `);
}

function ringHTML(pct, size = 72, stroke = 7, fs = '.95rem') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(100, pct) / 100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    <text class="ring-txt" x="50%" y="53%" dominant-baseline="middle" text-anchor="middle"
      transform="rotate(90 ${size / 2} ${size / 2})" style="font-size:${fs}">${pct}%</text>
  </svg>`;
}

function saveReflection(d) {
  const input = $('#refl-text');
  const text = input ? input.value.trim() : '';
  const cur = S.reflections[d] || {};
  if (!text && cur.mood == null) { toast('기분이나 한 줄을 남겨보세요'); return; }
  S.reflections[d] = { mood: cur.mood ?? null, text };
  save(); render();
  toast('회고를 저장했어요 ✍️');
}

/* ============================================================
   달력 뷰
   ============================================================ */
function monthGridDates(key) {
  const [y, m] = key.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const ws = S.settings.weekStart;
  const off = (first.getDay() - ws + 7) % 7;
  let start = fmtDate(new Date(y, m - 1, 1 - off));
  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(addDays(start, i));
  while (cells.length > 7 && monthKeyOf(cells[cells.length - 7]) !== key) cells.splice(-7);
  return cells;
}
/* 그 날의 '일정' — 루틴 + 할 일을 한 줄짜리 이벤트로 (구글 캘린더 칸에 그대로 표시) */
function dayEvents(d) {
  const evs = [];
  routinesFor(d).forEach(r => evs.push({
    kind: 'rt', title: r.title, time: r.time || '', done: isRDone(r.id, d), pri: 0
  }));
  todosOf(d).forEach(t => evs.push({
    kind: 'todo', title: t.title, time: t.time || '', done: !!t.done, pri: t.priority || 0
  }));
  return evs.sort((a, b) =>
    (a.done - b.done) ||
    (a.time || '99:99').localeCompare(b.time || '99:99') ||
    (b.pri - a.pri) ||
    (a.kind === b.kind ? 0 : a.kind === 'rt' ? -1 : 1));
}
const evClass = e => e.done ? 'ok' : e.kind === 'rt' ? 'rt' : e.pri === 2 ? 'hi' : '';
// 그 날에 남긴 '일상 기록'들 — 달력 칸 아래 점으로 요약
function dayMarks(d) {
  const L = lifeOf(d);
  const out = [];
  if (hasWriting(d)) out.push(['var(--violet)', '글']);
  if (L.meal) out.push(['var(--amber)', '식단']);
  if (L.workout && L.workout.length) out.push(['var(--red)', '운동']);
  if (L.read && L.read.length) out.push(['var(--blue)', '독서']);
  if (Object.keys(S.trackerLog[d] || {}).length) out.push(['var(--faint)', '기록']);
  return out;
}
const CAL_EV_MAX = 3;
function calCellHTML(d, key, sel) {
  const inMonth = monthKeyOf(d) === key;
  const ref = S.reflections[d];
  // 칸에는 '그날만의 일정'인 할 일을 보여줘요 — 매일 반복되는 루틴까지 넣으면 달력이 같은 글자로 가득 차요
  const evs = dayEvents(d).filter(e => e.kind === 'todo');
  const shown = evs.slice(0, CAL_EV_MAX);
  const rest = evs.length - shown.length;
  const wd = dow(d);
  const marks = dayMarks(d);
  const rs = d <= todayStr() ? routinesFor(d) : [];   // 아직 안 온 날의 루틴 게이지는 의미가 없어요
  const rdone = rs.filter(r => isRDone(r.id, d)).length;
  return `<button class="cal-cell ${inMonth ? '' : 'dim'} ${d === todayStr() ? 'today' : ''} ${d === sel ? 'sel' : ''} ${wd === 0 ? 'sunday' : wd === 6 ? 'saturday' : ''}"
    data-action="cal-day" data-date="${d}" data-long="cal-add">
    <span class="cal-daynum">
      <span class="n">${+d.slice(8)}</span>
      <span class="mood">${ref && ref.mood != null ? MOODS[ref.mood] : ''}</span>
    </span>
    <span class="cal-evs">
      ${shown.map(e => `<span class="cal-ev ${evClass(e)}">${e.time ? `<i class="tm">${esc(e.time.slice(0, 5))}</i>` : ''}${esc(e.title)}</span>`).join('')}
    </span>
    ${rest > 0 ? `<span class="cal-more">+${rest}</span>` : ''}
    <span class="cal-foot">
      ${marks.length ? `<span class="cal-marks">${marks.map(([c, t]) => `<i style="background:${c}" title="${t}"></i>`).join('')}</span>` : ''}
      ${rs.length ? `<span class="cal-rt ${rdone >= rs.length ? 'full' : ''}" title="루틴 ${rdone}/${rs.length}">
        <i style="width:${Math.round(rdone / rs.length * 100)}%"></i></span>` : ''}
    </span>
  </button>`;
}
/* 이 달 한눈에 — 완료율·기록한 날·남긴 글·예상 배당 */
function calSummaryHTML(key) {
  const { start, end } = periodRange('month', key);
  const t = todayStr();
  const upto = end > t ? t : end;
  let rate = 0, logged = 0, workout = 0;
  if (start <= upto) {
    const rs = rangeStats(start, end);
    rate = rs.rate;
    for (const d of dateRange(start, upto)) {
      const L = lifeOf(d);
      const any = L.meal || (L.workout && L.workout.length) || (L.read && L.read.length)
        || Object.keys(S.trackerLog[d] || {}).length || S.reflections[d] || memosOn(d).length;
      if (any) logged++;
      if (L.workout && L.workout.length) workout++;
    }
  }
  const writes = monthMemoCount(key)
    + Object.keys(S.reflections).filter(d => d.slice(0, 7) === key && S.reflections[d].text).length;
  const m = +key.slice(5, 7);
  const divUSD = monthlyDividendsUSD()[m - 1] * (1 - PF_SNAPSHOT.taxRate);
  const divTxt = divUSD >= 1 ? pfCompact(divUSD, V.assetCur) : '—';
  return `<div class="cal-sum">
    <div class="s"><div class="t">달성률</div><div class="v">${rate}<small>%</small></div></div>
    <div class="s"><div class="t">기록한 날</div><div class="v">${logged}<small>일</small></div></div>
    <div class="s"><div class="t">남긴 글</div><div class="v">${writes}<small>개</small></div></div>
    <div class="s"><div class="t">운동</div><div class="v">${workout}<small>일</small></div></div>
    <button class="s pf" data-action="cal-div" data-m="${m}">
      <div class="t">${m}월 배당 ›</div><div class="v">${divTxt}</div>
    </button>
  </div>`;
}
/* 목록(아젠다) 뷰 — 이 달에 '뭔가 있었던' 날만 날짜순으로 쭉 */
function calAgendaHTML(key) {
  const { start, end } = periodRange('month', key);
  const t = todayStr();
  const rows = [];
  for (const d of dateRange(start, end)) {
    const evs = dayEvents(d).filter(e => e.kind === 'todo');
    const marks = dayMarks(d);
    const ref = S.reflections[d];
    // 루틴만 있는 날은 건너뛰어요 — 매일 똑같이 반복돼서 목록이 루틴으로만 채워져요
    if (!evs.length && !marks.length && !(ref && ref.mood != null)) continue;
    const rs = d <= t ? routinesFor(d) : [];
    const rdone = rs.filter(r => isRDone(r.id, d)).length;
    const wd = dow(d);
    rows.push(`<div class="ag-day ${d === t ? 'is-today' : ''} ${wd === 0 ? 'sun' : ''}" data-action="cal-day" data-date="${d}">
      <div class="ag-when"><div class="ag-dnum">${+d.slice(8)}</div><div class="ag-dow">${KD[wd]}</div></div>
      <div class="ag-body">
        ${evs.map(e => `<div class="ag-line ${e.done ? 'ok' : ''}">
          <span class="dot ${evClass(e) === 'ok' ? '' : evClass(e)}"></span>
          ${e.time ? `<span class="tm">${esc(e.time.slice(0, 5))}</span>` : ''}
          <span class="tx">${esc(e.title)}</span>
        </div>`).join('')}
        ${ref && (ref.text || ref.mood != null) ? `<div class="ag-note">
          ${ref.mood != null ? MOODS[ref.mood] : ''} ${ref.text ? esc(ref.text) : ''}</div>` : ''}
        ${marks.length || rs.length ? `<div class="ag-note">
          ${rs.length ? `<span class="chip ${rdone >= rs.length ? 'accent' : ''}">🔁 ${rdone}/${rs.length}</span>` : ''}
          ${marks.map(([c, n]) =>
            `<span class="chip"><i style="display:inline-block;width:5px;height:5px;border-radius:99px;background:${c}"></i> ${n}</span>`).join('')}</div>` : ''}
      </div>
    </div>`);
  }
  if (!rows.length) return `<div class="card empty"><span class="big">🗓️</span>이 달에는 아직 남긴 것이 없어요<br>날짜를 눌러 일정이나 글을 더해보세요</div>`;
  return `<div class="card" style="padding:4px 14px">${rows.join('')}</div>`;
}
